<!doctype html><html lang="en" data-pen-mode="viewport"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 3 · Lesson</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{
  --paper:#f2f5f4; --sheet:#fbfcfb; --rule:#d5dfe2; --rule-2:#e6edef;
  --ink:#1b3358; --ink-soft:#4a6385; --graphite:#3b454f; --muted:#6b7680;
  --red:#b8322a; --amber:#b57b0e; --green:#2e7d5b; --green-soft:#d9ece3; --red-soft:#f5dfdc; --amber-soft:#f6ead1;
  --console:#16202b; --console-ink:#d3dfe6;
  --serif:"Fraunces", Georgia, "Times New Roman", serif;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--graphite);font:15px/1.5 var(--sans);
  background-image:linear-gradient(var(--rule-2) 1px,transparent 1px),linear-gradient(90deg,var(--rule-2) 1px,transparent 1px);
  background-size:24px 24px}
a{color:var(--ink)} a:hover{color:var(--red)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:2px}
button{font:inherit;cursor:pointer}
.eq{font-family:var(--serif);font-size:1.3rem;color:var(--ink);text-align:center;padding:.7rem 1rem;margin:0 0 1rem;
  background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--red)}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;line-height:1.15}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .25em}
.frac>span:last-child{padding:0 .25em}
.fig.strip{display:flex;justify-content:center;gap:0;margin:1rem 0}
.fig.strip span{width:44px;height:44px;border:2px solid var(--ink);margin-left:-2px;background:#fff}
.fig.grid5{display:grid;grid-template-columns:repeat(5,34px);width:max-content;margin:1rem auto;border:2px solid var(--ink)}
.fig.grid5 span{height:34px;border:1px solid var(--ink-soft);background:#fff}

/* ---- pen ---- */
.ink{position:fixed;left:0;top:0;pointer-events:none;z-index:70}
#ink-live{z-index:71}
html.pen-on #ink-live{cursor:crosshair}
#pen-toggle{position:fixed;left:14px;bottom:14px;z-index:80;background:var(--ink);color:#fff;border:0;border-radius:22px;
  padding:.5rem 1rem .5rem .8rem;font-weight:600;box-shadow:0 2px 0 #0d1d33}
#pen-toggle[aria-pressed=true]{background:var(--red);box-shadow:0 2px 0 #7a1e18}
#pen-toggle svg{vertical-align:-3px;margin-right:.35rem}
#pen-bar{position:fixed;left:14px;bottom:62px;z-index:80;background:var(--sheet);border:1.5px solid var(--ink);
  padding:.45rem;display:flex;flex-direction:column;gap:.35rem;width:max-content}
#pen-bar[hidden]{display:none}
#pen-bar .row{display:flex;gap:.3rem;align-items:center}
#pen-bar button{border:1px solid var(--rule);background:#fff;min-width:32px;height:32px;padding:0 .45rem;color:var(--graphite);font-size:.8rem}
#pen-bar button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink);font-weight:600}
#pen-bar .sw{width:32px;padding:0}
#pen-bar .sw i{display:block;width:16px;height:16px;border-radius:50%;margin:auto}
#pen-bar .nib i{display:block;margin:auto;border-radius:4px;background:var(--graphite);width:18px}
#pen-toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:90;background:var(--console);color:#fff;
  padding:.45rem .9rem;font-size:.85rem;opacity:0;transition:opacity .2s;pointer-events:none}
#pen-toast.show{opacity:1}
@media print{.pen-ui,.ink{display:none!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---- pick grid ---- */
.pfig{margin:1.2rem 0}
.pscroll{overflow-x:auto;padding-bottom:.3rem}
.pgrid{display:grid;grid-template-columns:auto repeat(var(--cols),minmax(3.2rem,1fr));gap:3px;width:max-content;font-family:var(--sans)}
.pgrid.compact{grid-template-columns:auto repeat(var(--cols),11px);gap:1px}
.ph{font:600 .85rem var(--sans);color:var(--ink);display:grid;place-items:center;padding:.1rem .2rem}
.ph.corner{font:500 .7rem var(--sans);color:var(--muted);display:flex;flex-direction:column;align-items:flex-end;justify-content:end;line-height:1.2}
.pgrid.compact .ph{font-size:.55rem;padding:0}
.pc{min-height:3rem;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--rule);font-size:.8rem;line-height:1.15}
.pc b{font:600 .88rem var(--sans)} .pc i{font-style:normal;font-size:.72rem;color:var(--green);margin-top:.1rem}
.pgrid.compact .pc{min-height:11px;width:11px;border:0}
.pc.keep{background:#dcefe6;border-color:#9ccbb4;color:#1d5a40}
.pc.plain{background:#e6f0ec;border-color:#bcd8cb;color:#1d5a40}
.pc.twin{background:#eceae6;border-color:#d4d0c8;color:#77716a}
.pc.x{background:#f3f1ee;color:#9b958d;border-color:#dcd8d1}
.pgrid.compact .pc.x{background:repeating-linear-gradient(45deg,#cfc9c0 0 2px,#f3f1ee 2px 4px)}
.pc[data-tw]{cursor:pointer}
.pc.hl{outline:3px solid var(--amber);outline-offset:-1px;position:relative;z-index:1}
.plegend{display:flex;flex-wrap:wrap;gap:.4rem 1.1rem;font:.78rem var(--sans);color:var(--muted);margin-top:.5rem}
.plegend .k{display:inline-block;width:.8rem;height:.8rem;vertical-align:-1px;margin-right:.3rem;border:1px solid #8a969e}
.plegend .k.keep{background:#dcefe6}.plegend .k.twin{background:#eceae6}.plegend .k.x{background:#f3f1ee}.plegend .k.plain{background:#e6f0ec}
figure.pfig figcaption{font:.95rem/1.55 var(--serif);color:var(--graphite);margin-top:.5rem;max-width:62ch}
.pgrid.tight{grid-template-columns:auto repeat(var(--cols),2.45rem);gap:2px}
.pgrid.tight .pc{min-height:1.9rem}.pgrid.tight .pc b{font-size:.62rem;letter-spacing:-.02em}
.pgrid.tight .ph{font-size:.72rem}
/* ---- step-by-step stories ---- */
.story{border:1.5px solid var(--ink);background:#fff;margin:1.2rem 0;max-width:100%}
.story .shead{font:600 1rem var(--serif);color:#fff;background:var(--ink);padding:.45rem .8rem}
.story.worked .shead{background:var(--green)}
.story.plan .shead{background:var(--red)}
.frames{padding:.8rem 1rem .4rem}
.frame{display:none}.frame.on{display:block}
.story.all .frame{display:block;border-bottom:1px dashed var(--rule);padding-bottom:.8rem;margin-bottom:.8rem}
.fstep{font:600 .74rem var(--sans);color:var(--red);margin-bottom:.4rem}
.vis{min-height:5.5rem;display:flex;flex-direction:column;align-items:flex-start;gap:.5rem;overflow-x:auto;padding:.3rem 0 .5rem}
.say p{font:1.02rem/1.6 var(--serif);color:#1f2a35;margin:.3rem 0;max-width:62ch}
.ask{margin:.5rem 0 .2rem;padding:.4rem .7rem;background:var(--amber-soft);border-left:3px solid var(--amber);font:.92rem/1.45 var(--sans);color:#5a4100;max-width:62ch}
.snav{display:flex;align-items:center;gap:.5rem;padding:.5rem 1rem .7rem;border-top:1px solid var(--rule-2);flex-wrap:wrap}
.sbtn{border:1.5px solid var(--ink);background:#fff;color:var(--ink);padding:.3rem .7rem;font:500 .88rem var(--sans)}
.sbtn.primary{background:var(--ink);color:#fff}.sbtn:disabled{opacity:.35;cursor:default}
.sbtn.ghost{border-color:var(--rule);color:var(--muted);margin-left:auto}
.sdots{display:flex;gap:.3rem}.sdot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink-soft);background:#fff;padding:0}
.sdot.seen{background:var(--ink-soft)}.sdot.on{background:var(--red);border-color:var(--red)}
@media print{.story .frame{display:block}.snav{display:none}}
/* primitives */
.chips{display:inline-flex;flex-wrap:wrap;gap:3px}
.chip{display:inline-block;font:500 .78rem var(--mono);border:1px solid var(--ink-soft);padding:.05rem .32rem;background:#fff;color:var(--ink);border-radius:3px}
.chip.banned{color:var(--red);border-color:var(--red);text-decoration:line-through;background:var(--red-soft)}
.chip.used{color:#a7b0b7;border-color:#d4dade;text-decoration:line-through}
.chip.pick{background:var(--amber-soft);border-color:var(--amber)}
.slots{display:flex;align-items:stretch;gap:.35rem;flex-wrap:wrap}
.slot{border:2px dashed #b9c5cc;min-width:4.6rem;max-width:11rem;display:flex;flex-direction:column;background:#fbfcfc}
.slot.on{border:2px solid var(--amber);background:#fffaf0}.slot.done{border:2px solid var(--ink-soft);background:#fff}
.slot .sl{font:600 .72rem var(--sans);color:var(--ink-soft);padding:.2rem .35rem;border-bottom:1px solid var(--rule-2)}
.slot .sb{padding:.3rem;flex:1;font:.78rem var(--sans);color:var(--muted)}
.slot .sc{font:600 1.35rem var(--serif);color:var(--ink);text-align:center;padding:.1rem 0 .2rem}
.slot:not(.on):not(.done) .sc{color:#c3ccd2}
.op{align-self:center;font:600 1.3rem var(--serif);color:var(--ink)}
.result{align-self:center;font:600 1.5rem var(--serif);color:#fff;background:var(--green);padding:.2rem .7rem}
.vnote{font:.85rem var(--sans);color:var(--muted)}
.word{display:inline-flex;gap:2px}
.tile{display:inline-flex;align-items:baseline;justify-content:center;min-width:1.7rem;height:1.9rem;padding:0 .2rem;border:1.5px solid var(--ink);background:#fff;font:600 1.05rem var(--mono);color:var(--ink);line-height:1.8rem}
.tile sub{font-size:.62rem;margin-left:1px}
.tile.blue{background:#dbe7f7;border-color:#3a67a8;color:#21457c}.tile.red{background:#f6dcd8;border-color:#b8322a;color:#8a231d}.tile.green{background:#dcefe3;border-color:#2e7d5b;color:#1d5a40}
.bundle-row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.bundle{display:flex;gap:.4rem;flex-wrap:wrap;border:1.5px dashed var(--amber);padding:.35rem;background:#fffaf0}
.barrow{font:600 1.3rem var(--serif);color:var(--amber)}
.bres{font:600 1rem var(--serif);color:var(--ink)}
.blabel{font:.82rem var(--sans);color:var(--muted)}
.vtable{border-collapse:collapse;font:.88rem var(--mono)}
.vtable th,.vtable td{border:1px solid var(--rule);padding:.22rem .5rem;text-align:center}
.vtable th{background:#eef2f5;color:var(--ink);font-family:var(--sans);font-weight:600}
.vtable tr.hl td{background:var(--amber-soft);font-weight:600}
.bigline{font:600 1.15rem/1.4 var(--serif);color:var(--ink);padding:.2rem 0}
.bigline.sm{font-size:.9rem;color:var(--ink-soft)}
.bogus{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px;color:var(--red)}
.vrow{display:flex;flex-wrap:wrap;align-items:flex-start}
.vstack{display:flex;flex-direction:column;gap:.5rem;align-items:flex-start}
.treewrap{overflow-x:auto;max-width:100%}
svg.tree .te{stroke:#9fb0bc;stroke-width:1.5}svg.tree .te.on{stroke:var(--amber);stroke-width:3}
svg.tree .tn rect{fill:#fff;stroke:var(--ink-soft);stroke-width:1.3}svg.tree .tn.on rect{fill:var(--amber-soft);stroke:var(--amber)}
svg.tree text{font:600 11px var(--sans);fill:var(--ink)}svg.tree .troot{fill:var(--ink)}svg.tree .tlab.small{font:500 10px var(--sans);fill:var(--muted)}
svg.dots .de{stroke:#9fb0bc;stroke-width:2}svg.dots .de.new{stroke:var(--red);stroke-width:3}
svg.dots .dn{fill:#fff;stroke:var(--ink);stroke-width:2}svg.dots .dt{font:600 12px var(--sans);fill:var(--ink)}
.flow{display:flex;flex-direction:column;align-items:flex-start;gap:0}
.fn{border:1.5px solid var(--rule);padding:.3rem .7rem;font:500 .88rem var(--sans);color:var(--muted);background:#fff}
.fn.past{border-color:var(--ink-soft);color:var(--ink-soft)}.fn.on{border:2px solid var(--red);color:var(--ink);font-weight:600;background:#fff6f4}
.fa{color:#b7c2c9;padding-left:1.2rem;line-height:1.1}
.beads{display:flex;gap:.4rem;margin:.15rem 0}.bead{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink-soft);background:#fff}
.beads.sq .bead{border-radius:3px}
.bead.r{background:#c0392b;border-color:#8a231d}.bead.q{background:repeating-linear-gradient(45deg,#eef1f3 0 4px,#fff 4px 8px)}
.bead.y{background:#f2c641;border-color:#a8841a}.bead.g{background:#3e9b6c}.bead.b{background:#3a67a8}
.chairs{display:flex;gap:.35rem}.chair{width:3.2rem;height:2.4rem;border:2px solid var(--ink-soft);border-bottom-width:5px;display:grid;place-items:center;font:600 .85rem var(--sans);color:var(--ink);background:#fff}
.chair.full{background:#e9eef4}.chair.next{border-color:var(--amber);background:#fffaf0}
.shelves{display:flex;gap:.8rem}.shelf{display:flex;flex-direction:column;align-items:center;border-bottom:3px solid var(--graphite);padding:0 .4rem}
.shelf span{font:.72rem var(--sans);color:var(--muted);order:3}.bk{width:2.8rem;height:1.4rem;border:1.5px solid var(--ink);background:#dbe7f7;font:600 .8rem var(--mono);display:grid;place-items:center;margin-top:2px}
.books{display:flex;gap:.3rem;align-items:flex-end}.books .bk{width:auto;padding:0 .5rem;height:2.6rem}.books .bk.blk{background:var(--amber-soft);border-color:var(--amber)}
.plate{display:flex;gap:2px;margin:1px 0}.plate span{width:1.6rem;height:1.5rem;display:grid;place-items:center;font:600 .8rem var(--mono);border:1px solid var(--rule)}
.plate .L{background:var(--amber-soft);border-color:var(--amber);color:#7a5200}.plate .D{color:#9aa6af}
.cboard{display:grid;grid-template-columns:repeat(5,2.3rem);gap:1px;border:2px solid var(--ink)}
.cboard span{height:2.3rem;display:grid;place-items:center;font:600 .78rem var(--mono)}
.cboard .dk{background:#c9d4dc;color:var(--ink)}.cboard .lt{background:#fff;color:var(--ink)}
.pc.empty{background:#fff;border:1px dashed var(--rule)}
/* ---- plan-guided frames ---- */
.pf{display:grid;grid-template-columns:13.5rem minmax(0,1fr);gap:1rem;align-items:start;width:100%}
.pmini{display:flex;flex-direction:column;gap:3px;border-right:2px solid var(--rule-2);padding-right:.7rem}
.pm{display:flex;gap:.4rem;align-items:baseline;font:500 .76rem/1.3 var(--sans);color:#a3adb5;border:1px solid var(--rule-2);padding:.2rem .4rem;background:#fff}
.pm .pmn{font:600 .7rem var(--mono);min-width:.9rem}
.pm.past{color:var(--ink-soft);border-color:#c6d0d6}
.pm.on{color:var(--ink);font-weight:600;border:2px solid var(--red);background:#fff6f4}
.pm.skip{color:#b5bcc2;border-style:dashed;text-decoration:line-through;text-decoration-color:#c9cfd4}
.pm.skip i{font-style:normal;text-decoration:none;display:inline-block;font-size:.66rem;color:#9aa4ab;margin-left:.2rem}
.pf-main{display:flex;flex-direction:column;gap:.55rem;align-items:flex-start;min-width:0;overflow-x:auto}
.pf-tag{font:600 .95rem var(--serif);color:var(--red)}
.story .frame .vis:has(.pf){min-height:0}
.yes{display:inline-block;font:600 .85rem var(--sans);color:#fff;background:var(--red);padding:.1rem .5rem}
.no{display:inline-block;font:600 .85rem var(--sans);color:#fff;background:var(--green);padding:.1rem .5rem}
.ex{font:.8rem var(--sans);color:var(--muted)}
@media (max-width:700px){.pf{grid-template-columns:1fr}.pmini{border-right:0;border-bottom:2px solid var(--rule-2);padding:0 0 .5rem;flex-direction:row;flex-wrap:wrap}
  .pm{font-size:.68rem}.pm:not(.on) .pmn~*{display:none}}
.pf.plan{grid-template-columns:minmax(14rem,19rem) minmax(0,1fr)}
.pf.plan .pf-main{border-left:3px solid var(--amber);padding-left:.9rem}
.pf.plan .pf-tag{color:var(--amber);font-size:.9rem}
.ex-say{font:.95rem/1.5 var(--serif);color:#3a3020;max-width:42ch}
@media (max-width:700px){.pf.plan{grid-template-columns:1fr}.pf.plan .pf-main{border-left:0;padding-left:0;border-top:3px solid var(--amber);padding-top:.5rem}
  .pm:not(.on){font-size:0;padding:.15rem .3rem}.pm:not(.on) .pmn{font-size:.7rem}}
.story.worked .fstep,.story.plan .fstep{display:none}
.pf .slots{flex-wrap:nowrap}
.pf.plan{grid-template-columns:12.5rem minmax(0,1fr)}
.pf.plan .fn{font-size:.8rem;padding:.25rem .55rem}
body{overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr}
.top{display:flex;align-items:center;gap:.6rem;padding:.45rem .9rem;background:var(--sheet);border-bottom:3px solid var(--ink);flex-wrap:wrap}
.top h1{font:600 1.1rem var(--serif);color:var(--ink);margin:0 .6rem 0 0;white-space:nowrap}
.top select{font:inherit;padding:.3rem .4rem;border:1px solid var(--ink-soft);background:#fff;max-width:17rem}
.iconbtn{border:1px solid var(--ink-soft);background:#fff;color:var(--ink);width:32px;height:32px;padding:0;display:inline-grid;place-items:center}
.iconbtn:disabled{opacity:.35;cursor:default}
.meta{font:500 .85rem var(--mono);color:var(--muted);padding:0 .3rem}
#timer{color:var(--ink)}
.top nav{margin-left:auto;display:flex;gap:1rem;font-size:.9rem}
.top nav a[aria-current]{font-weight:600;text-decoration-thickness:2px}
#rail-toggle{display:none}
.panes{display:grid;grid-template-columns:230px minmax(0,1fr) minmax(0,1fr);min-height:0}
.pane{min-height:0;overflow:auto}
/* rail */
#rail{background:var(--paper);border-right:2px solid var(--red);padding:.6rem .5rem 4.5rem}
.rail-sec h3{font:600 .82rem var(--sans);color:var(--ink-soft);margin:.9rem .4rem .3rem}
.rail-sec ol{list-style:none;margin:0;padding:0}
.rail-sec a{display:flex;gap:.45rem;align-items:baseline;padding:.28rem .4rem;text-decoration:none;color:var(--graphite);font-size:.88rem;border-left:3px solid transparent}
.rail-sec a[aria-current]{background:var(--sheet);border-left-color:var(--ink);color:var(--ink);font-weight:600}
.rail-sec .n{font:500 .78rem var(--mono);color:var(--muted);min-width:2.2em}
.dot{flex:none;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--muted);transform:translateY(1px)}
a[data-state=progress] .dot{border-color:var(--amber);background:linear-gradient(90deg,var(--amber) 50%,transparent 50%)}
a[data-state=closed] .dot{border-color:var(--green);background:var(--green)}
/* middle */
.mid{background:var(--sheet);border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0}
[role=tablist]{display:flex;gap:0;border-bottom:1px solid var(--rule);padding:0 .8rem;flex:none}
[role=tab]{border:0;background:none;padding:.6rem .8rem .5rem;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
[role=tab][aria-selected=true]{color:var(--ink);border-bottom-color:var(--red);font-weight:600}
.tabpanel{padding:1.1rem 1.4rem 2rem;overflow:auto;flex:1;min-height:0}
.ptitle,.ctitle{font:600 1.35rem/1.25 var(--serif);color:var(--ink);margin:0 0 .5rem}
.pnum{font:500 .9rem var(--mono);color:var(--red);margin-right:.6rem;vertical-align:.12em}
.src{font-size:.82rem;color:var(--muted);margin:-.2rem 0 .6rem}
.ptext{font:1.08rem/1.6 var(--serif);color:#222c36;max-width:62ch}
.tabpanel p{max-width:64ch}
.solution{margin-top:1.4rem;padding:.8rem 1rem;border:1.5px solid var(--green);background:var(--green-soft)}
.solution h3{margin:0 0 .3rem;font:600 .95rem var(--sans);color:var(--green)}
.solution .big{font:600 1.35rem var(--serif);color:var(--ink);margin:.2rem 0}
#worked{border-color:var(--ink-soft);background:#eef2f7}#worked h3{color:var(--ink)}
.check{font-size:.9rem;color:var(--muted)}
#steps-list{list-style:none;padding:0;margin:0}
#steps-list li{padding:.55rem .2rem;border-bottom:1px dashed var(--rule)}
#steps-list .stat{display:block;font:500 .8rem var(--mono);color:var(--muted);margin-top:.15rem}
#steps-list li[data-status=first] .stat,#steps-list li[data-status=tries] .stat{color:var(--green)}
#steps-list li[data-status=given] .stat{color:var(--red)}
.rules dl{display:grid;grid-template-columns:max-content 1fr;gap:.45rem 1rem;margin:0}
.rules dt{font-weight:600;color:var(--ink)}.rules dd{margin:0}
/* right */
.right{display:flex;flex-direction:column;min-height:0;padding:.8rem 1rem .8rem;gap:.55rem}
#step-pills{display:flex;gap:.35rem;flex-wrap:wrap}
.pill{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink-soft);background:#fff;color:var(--ink);font:600 .85rem var(--mono);padding:0}
.pill[aria-current=step]{box-shadow:0 0 0 3px var(--amber-soft),0 0 0 4.5px var(--amber)}

"frame on\" data-i=\"0\" aria-label=\"Step 1 of 6\"><div class=\"fstep\">Step 1 of 6<\/div><div class=\"vis\"><div class=\"vstack\"><div class=\"vrow\" style=\"gap:1rem\"><div class=\"vstack\"><div class=\"bigline sm\">Sandwiches<\/div><span class=\"chips\"><span class=\"chip \">Ham<\/span><span class=\"chip \">Egg<\/span><span class=\"chip \">Tuna<\/span><\/span><\/div><div class=\"vstack\"><div class=\"bigline sm\">Drinks<\/div><span class=\"chips\"><span class=\"chip \">Milk<\/span><span class=\"chip \">Juice<\/span><\/span><\/div><\/div><\/div><\/div><div class=\"say\"><p>A lunch is <b>one sandwich and one drink<\/b>. How many different lunches are there?<\/p><\/div><div class=\"ask\"><b>Ask him:<\/b> Show me one lunch.<\/div><\/section><section class=\"frame\" data-i=\"1\" aria-label=\"Step 2 of 6\"><div class=\"fstep\">Step 2 of 6<\/div><div class=\"vis\"><div class=\"vstack\"><div class=\"bigline \"><span class=\"bogus\">3 + 2 = 5 lunches?<\/span><\/div><span class=\"chips\"><span class=\"chip \">Ham<\/span><span class=\"chip \">Egg<\/span><span class=\"chip \">Tuna<\/span><span class=\"chip \">Milk<\/span><span class=\"chip \">Juice<\/span><\/span><\/div><\/div><div class=\"say\"><p>A very common first answer is 3 + 2 = 5. But 5 is the number of <b>foods<\/b>, not the number of <b>lunches<\/b>. Ham + Milk and Ham + Juice are already two lunches that both use Ham.<\/p><\/div><div class=\"ask\"><b>Ask him:<\/b> What does the 5 count?<\/div><\/section><section class=\"frame\" data-i=\"2\" aria-label=\"Step 3 of 6\"><div class=\"fstep\">Step 3 of 6<\/div><div class=\"vis\"><table class=\"vtable\"><thead><tr><th>sandwich ↓  drink →<\/th><th>Milk<\/th><th>Juice<\/th><\/tr><\/thead><tbody><tr><td>Ham<\/td><td>Ham + Milk<\/td><td>Ham + Juice<\/td><\/tr><tr><td>Egg<\/td><td>Egg + Milk<\/td><td>Egg + Juice<\/td><\/tr><tr><td>Tuna<\/td><td>Tuna + Milk<\/td><td>Tuna + Juice<\/td><\/tr><\/tbody><\/table><\/div><div class=\"say\"><p>List them in an organised way: <b>hold x=\"460.0\" y=\"96.0\" text-anchor=\"middle\">Tuna<\/text><\/g><g class=\"tn\"><rect x=\"402.0\" y=\"142.0\" width=\"26\" height=\"22\" rx=\"4\"/><text x=\"415.0\" y=\"158.0\" text-anchor=\"middle\">Milk<\/text><\/g><g class=\"tn\"><rect x=\"372.0\" y=\"204.0\" width=\"26\" height=\"22\" rx=\"4\"/><text x=\"385.0\" y=\"220.0\" text-anchor=\"middle\">Ap<\/text><\/g><g class=\"tn\"><rect x=\"402.0\" y=\"204.0\" width=\"26\" height=\"22\" rx=\"4\"/><text x=\"415.0\" y=\"220.0\" text-anchor=\"middle\">Pe<\/text><\/g><g class=\"tn\"><rect x=\"432.0\" y=\"204.0\" width=\"26\" height=\"22\" rx=\"4\"/><text x=\"445.0\" y=\"220.0\" text-anchor=\"middle\">Pl<\/text><\/g><g class=\"tn\"><rect x=\"492.0\" y=\"142.0\" width=\"26\" height=\"22\" rx=\"4\"/><text x=\"505.0\" y=\"158.0\" text-anchor=\"middle\">Juice<\/text><\/g><g class=\"tn\"><rect x=\"462.0\" y=\"204.0\" width=\"26\" height=\"22\" rx=\"4\"/><text x=\"475.0\" y=\"220.0\" text-anchor=\"middle\">Ap<\/text><\/g><g class=\"tn\"><rect x=\"492.0\" y=\"204.0\" width=\"26\" height=\"22\" rx=\"4\"/><text x=\"505.0\" y=\"220.0\" text-anchor=\"middle\">Pe<\/text><\/g><g class=\"tn\"><rect x=\"522.0\" y=\"204.0\" width=\"26\" height=\"22\" rx=\"4\"/><text x=\"535.0\" y=\"220.0\" text-anchor=\"middle\">Pl<\/text><\/g><\/svg><\/div><\/div><div class=\"say\"><p>Add a fruit: Apple, Pear or Plum. <b>Every<\/b> one of the 6 lunches splits into 3. So the count is 6 × 3 = 18.<\/p><\/div><div class=\"ask\"><b>Ask him:<\/b> If we added a 4th fruit, what would change?<\/div><\/section><section class=\"frame\" data-i=\"5\" aria-label=\"Step 6 of 6\"><div class=\"fstep\">Step 6 of 6<\/div><div class=\"vis\"><div class=\"slots\"><div class=\"slot on\"><div class=\"sl\">sandwich<\/div><div class=\"sb\"><span class=\"chips\"><span class=\"chip \">Ham<\/span><span class=\"chip \">Egg<\/span><span class=\"chip \">Tuna<\/span><\/span><\/div><div class=\"sc\">3<\/div><\/div><div class=\"op\">×<\/div><div class=\"slot on\"><div class=\"sl\">drink<\/div><div class=\"sb\"><span class=\"chips\"><span class=\"chip \">Milk<\/span><span class=\"chip \">Juice<\/span><\/span><\/div><div class=\"sc\">2<\/div><\/div><div class=\"op\">×<\/div><div class=\"slot on\"><div class=\"sl\">fruit<\/div><div class=\"sb\"><span class=\"chips\"><span class=\"chip \">Apple<\/span><span class=\"chip \">Pear<\/span><span class=\"chip \">Plum<\/span><\/span><\/div><div class=\"sc\">3<\/div><\/div><div class=\"op\">=<\/div><div class=\"result\">18<\/div><\/div><\/div><div class=\"say\"><p>You don't need to draw the tree every time. Draw one <b>slot<\/b> per decision, write how many options it has, and multiply. <b>The rule of product:<\/b> if every choice leaves the same number of options for the next decision, multiply the counts.<\/p><\/div><div class=\"ask\"><b>Ask him:<\/b> Make up your own lunch problem with 4 sandwiches. How many lunches?<\/div><\/section><\/div><div class=\"snav\"><button type=\"button\" class=\"sbtn\" data-prev disabled aria-label=\"Previous step\">← Back<\/button><span class=\"sdots\"><button type=\"button\" class=\"sdot on\" data-go=\"0\" aria-label=\"Go to step 1\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"1\" aria-label=\"Go to step 2\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"2\" aria-label=\"Go to step 3\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"3\" aria-label=\"Go to step 4\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"4\" aria-label=\"Go to step 5\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"5\" aria-label=\"Go to step 6\"><\/button><\/span><button type=\"button\" class=\"sbtn primary\" data-next aria-label=\"Next step\">Next step →<\/button><button type=\"button\" class=\"sbtn ghost\" data-all aria-pressed=\"false\">Show all steps<\/button><\/div><\/div>"], "restrict": ["Restrictions change the options", "<div class=\"eq\" role=\"math\">9 × 10 × 10 × 10 × 10 = 90,000<\/div><p class=\"idea\"><b>The idea:<\/b> A rule changes what's allowed in a slot: list what's allowed, cross out what's banned, count.<\/p><div class=\"story concept\" id=\"s-restrict\" data-n=\"5\" data-cur=\"0\"><div class=\"shead\">Restrictions: change what goes in each slot<\/div><div class=\"frames\"><section class=\"frame on\" data-i=\"0\" aria-label=\"Step 1 of 5\"><div class=\"fstep\">Step 1 of 5<\/div><div class=\"vis\"><div class=\"slots\"><div class=\"slot \"><div class=\"sl\">tens digit<\/div><div class=\"sb\"><span class=\"chips\"><span class=\"chip \">0<\/span><span class=\"chip \">1<\/span><span class=\"chip \">2<\/span><span class=\"chip \">3<\/span><span class=\"chip \">4<\/span><span class=\"chip \">5<\/span><span class=\"chip \">6<\/span><span class=\"chip \">7<\/span><span class=\"chip \">8<\/span><span class=\"chip \">9<\/span><\/span><\/div><div class=\"sc\">?<\/div><\/div><div class=\"op\">×<\/div><div class=\"slot \"><div class=\"sl\">ones digit<\/div><div class=\"sb\"><span class=\"chips\"><span class=\"chip \">0<\/span><span class=\"chip \">1<\/span><span class=\"chip \">2<\/span><span class=\"chip \">3<\/span><span class=\"chip \">4<\/span><span class=\"chip \">5<\/span><span class=\"chip \">6<\/span><span class=\"chip \">7<\/span><span class=\"chip \">8<\/span><span class=\"chip \">9<\/span><\/span><\/div><div class=\"sc\">?<\/div><\/div><\/div><\/div><div class=\"say\"><p>A two-digit number is <b>two digit slots<\/b>. Each slot could hold any digit 0 to 9… almost.<\/p><\/div><div class=\"ask\"><b>Ask him:<\/b> Is 07 a two-digit number?<\/div><\/section><section class=\"frame\" data-i=\"1\" aria-label=\"Step 2 of 5\"><div class=\"fstep\">Step 2 of 5<\/div><div class=\"vis\"><div class=\"slots\"><div class=\"slot on\"><div class=\"sl\">tens digit<\/div><div class=\"sb\"><span class=\"chips\"><span class=\"chip banned\">0<\/span><span class=\"chip \">1<\/span><span class=\"chip \">2<\/span><span class=\"chip \">3<\/span><span class=\"chip \">4<\/span><span class=\"chip \">5<\/span><span class=\"chip \">6<\/span><span class=\"chip \">7<\/span><span class=\"chip \">8<\/span><span class=\"chip \">9<\/span><\/span><\/div><div class=\"sc\">9<\/div><\/div><div class=\"op\">×<\/div><div class=\"slot on\"><div class=\"sl\">ones digit<\/div><div class=\"sb\"><span class=\"chips\"><span class=\"chip \">0<\/span><span class=\"chip \">1<\/span><span class=\"chip \">2<\/span><span class=\"chip \">3<\/span><span class=\"chip \">4<\/span><span class=\"chip \">5<\/span><span class=\"chip \">6<\/span><span class=\"chip \">7<\/span><span class=\"chip \">8<\/span><span class=\"chip \">9<\/span><\/span><\/div><div class=\"sc\">10<\/div><\/div><div class=\"op\">=<\/div><div class=\"result\">90<\/div><\/div><\/div><div class=\"say\"><p>The first slot can't be 0, because 07 is just 7 in disguise. So 9 options first, 10 options second: 9 × 10 = 90. Check another way: the two-digit numbers run from 10 to 99, and 99 − 10 + 1 = 90.<\/p><\/div><div class=\"ask\"><b>Ask him:<\/b> Why is the first slot different from the second?<\/div><\/section><section class=\"frame\" data-i=\"2\" aria-label=\"Step 3 of 5\"><div class=\"fstep\">Step 3 of 5<\/div><div class=\"vis\"><div class=\"slots\"><div class=\"slot on\"><div class=\"sl\">tens digit<\/div><div class=\"sb\"><span class=\"chips\"><span class=\"chip banned\">0<\/span><span class=\"chip \">1<\/span><span class=\"chip \">2<\/span><span class=\"chip \">3<\/span><\/span><\/div><div class=\"sc\">3<\/div><\/div><div class=\"op\">×<\/div><div class=\"slot on\"><div class=\"sl\">ones digit<\/div><div class=\"sb\"><span class=\"chips\"><span class=\"chip \">0<\/span><span class=\"chip \">1<\/span><span class=\"chip \">2<\/span><span class=\"chip \">3<\/span><\/span><\/div><div class=\"sc\">4<\/div><\/div><div class=\"op\">=<\/div><div class=\"result\">12<\/div><\/div><\/div><div class=\"say\"><p>Now add a rule: <b>use only the digits 0, 1, 2, 3<\/b>. Write the allowed list in each slot and cross out what's banned. 3 × 4 = 12.<\/p><\/div><\/section><section class=\"frame\" data-i=\"3\" aria-label=\"Step 4 of 5\"><div class=\"fstep\">Step 4 of 5<\/div><div class=\"vis\"><table class=\"vtable\"><thead><tr><th>tens ↓  ones →<\/th><th>0<\/th><th>1<\/th><th>2<\/th><th>3<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>10<\/td><td>11<\/td><td>12<\/td><td>13<\/td><\/tr><tr><td>2<\/td><td>20<\/td><td>21<\/td><td>22<\/td><td>23<\/td><\/tr><tr><td>3<\/td><td>30<\/td><td>31<\/td><td>32<\/td><td>33<\/td><\/tr><\/tbody><\/table><\/div><div class=\"say\"><p>Check by listing: hold the tens digit fixed and run through the ones digits. 3 rows of 4 numbers each. Twelve numbers, and the table shows why it's 3 × 4.<\/p><\/div><div class=\"ask\"><b>Ask him:<\/b> Which row would 03 be in? Why isn't it there?<\/div><\/section><section class=\"frame\" data-i=\"4\" aria-label=\"Step 5 of 5\"><div class=\"fstep\">Step 5 of 5<\/div><div class=\"vis\"><div class=\"slots\"><div class=\"slot on\"><div class=\"sl\">1st<\/div><div class=\"sb\"><span class=\"chips\"><span class=\"chip banned\">0<\/span><span class=\"chip \">1<\/span><span class=\"chip \">2<\/span><span class=\"chip \">3<\/span><span class=\"chip \">4<\/span><span class=\"chip \">5<\/span><span class=\"chip \">6<\/span><span class=\"chip \">7<\/span><span class=\"chip \">8<\/span><span class=\"chip \">9<\/span><\/span><\/div><div class=\"sc\">9<\/div><\/div><div class=\"op\">×<\/div><div class=\"slot on\"><div class=\"sl\">2nd<\/div><div class=\"sb\"><\/div><div class=\"sc\">10<\/div><\/div><div class=\"op\">×<\/div><div class=\"slot on\"><div class=\"sl\">3rd<\/div><div class=\"sb\"><\/div><div class=\"sc\">10<\/div><\/div><div class=\"op\">×<\/div><div class=\"slot on\"><div class=\"sl\">4th<\/div><div class=\"sb\"><\/div><div class=\"sc\">10<\/div><\/div><div class=\"op\">×<\/div><div class=\"slot on\"><div class=\"sl\">5th<\/div><div class=\"sb\"><\/div><div class=\"sc\">10<\/div><\/div><div class=\"op\">=<\/div><div class=\"result\">90,000<\/div><\/div><\/div><div class=\"say\"><p><b>General move:<\/b> for each slot, list what's allowed, cross out what the rule bans, and count. For five-digit numbers that's 9 × 10 × 10 × 10 × 10 = 90,000, and the range check agrees: 99,999 − 10,000 + 1.<\/p><\/div><div class=\"ask\"><b>Ask him:<\/b> How many three-digit numbers use only the digits 1, 2, 3?<\/div><\/section><\/div><div class=\"snav\"><button type=\"button\" class=\"sbtn\" data-prev disabled aria-label=\"Previous step\">← Back<\/button><span class=\"sdots\"><button type=\"button\" class=\"sdot on\" data-go=\"0\" aria-label=\"Go to step 1\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"1\" aria-label=\"Go to step 2\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"2\" aria-label=\"Go to step 3\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"3\" aria-label=\"Go to step 4\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"4\" aria-label=\"Go to step 5\"><\/button><\/span><button type=\"button\" class=\"sbtn primary\" data-next aria-label=\"Next step\">Next step →<\/button><button type=\"button\" class=\"sbtn ghost\" data-all aria-pressed=\"false\">Show all steps<\/button><\/div><\/div>"], "first": ["Decide the most restricted thing first", "<div class=\"eq\" role=\"math\">4 × 2<sup>3<\/sup> = 32<\/div><p class=\"idea\"><b>The idea:<\/b> If one rule makes the branches uneven, decide that thing first.<\/p><div class=\"story concept\" id=\"s-first\" data-n=\"6\" data-cur=\"0\"><div class=\"shead\">Decide the most restricted thing first<\/div><div class=\"frames\"><section class=\"frame on\" data-i=\"0\" aria-label=\"Step 1 of 6\"><div class=\"fstep\">Step 1 of 6<\/div><div class=\"vis\"><div class=\"beads\"><span class=\"bead q\"><\/span><span class=\"bead q\"><\/span><span class=\"bead q\"><\/span><span class=\"bead q\"><\/span><\/div><span class=\"chips\"><span class=\"chip \">Red<\/span><span class=\"chip \">White<\/span><span class=\"chip \">Black<\/span><\/span><\/div><div class=\"say\"><p>Four beads in a row, each Red, White or Black, with <b>exactly one red<\/b> bead. How many rows?<\/p><\/div><div class=\"ask\"><b>Ask him:<\/b> Show me one row that works and one that doesn't.<\/div><\/section><section class=\"frame\" data-i=\"1\" aria-label=\"Step 2 of 6\"><div class=\"fstep\">Step 2 of 6<\/div><div class=\"vis\"><div class=\"vstack\"><div class=\"treewrap\"><svg class=\"tree\" viewBox=\"0 0 372 184\" width=\"372\" role=\"img\" aria-label=\"tree diagram\"><line x1=\"186.0\" y1=\"30.0\" x2=\"54.0\" y2=\"80.0\" class=\"te\"/><line x1=\"54.0\" y1=\"100.0\" x2=\"32.0\" y2=\"142.0\" class=\"te\"/><line x1=\"54.0\" y1=\"100.0\" x2=\"76.0\" y2=\"142.0\" class=\"te\"/><line x1=\"186.0\" y1=\"30.0\" x2=\"164.0\" y2=\"80.0\" class=\"te\"/><line x1=\"164.0\" y1=\"100.0\" x2=\"120.0\" y2=\"142.0\" class=\"te\"/><line x1=\"164.0\" y1=\"100.0\" x2=\"164.0\" y2=\"142.0\" class=\"te\"/><line x1=\"164.0\" y1=\"100.0\" x2=\"208.0\" y2=\"142.0\" class=\"te\"/><line x1=\"186.0\" y1=\"30.0\" x2=\"296.0\" y2=\"80.0\" class=\"te\"/><line x1=\"296.0\" y1=\"100.0\" x2=\"252.0\" y2=\"142.0\" class=\"te\"/><line x1=\"296.0\" y1=\"100.0\" x2=\"296.0\" y2=\"142.0\" class=\"te\"/><line x1=\"296.0\" y1=\"100.0\" x2=\"340.0\" y2=\"142.0\" class=\"te\"/><circle cx=\"186.0\" cy=\"22.0\" r=\"5\" class=\"troot\"/><text x=\"196.0\" y=\"26.0\" class=\"tlab small\">bead 1 → bead 2<\/text><g class=\"tn\"><rect x=\"37.0\" y=\"80.0\" width=\"34\" height=\"22\" rx=\"4\"/><text x=\"54.0\" y=\"96.0\" text-anchor=\"middle\">R<\/text><\/g><g class=\"tn\"><rect x=\"15.0\" y=\"142.0\" width=\"34\" height=\"22\" rx=\"4\"/><text x=\"32.0\" y=\"158.0\" text-anchor=\"middle\">W<\/text><\/g><g class=\"tn\"><rect x=\"59.0\" y=\"142.0\" width=\"34\" height=\"22\" rx=\"4\"/><text x=\"76.0\" y=\"158.0\" text-anchor=\"middle\">B<\/text><\/g><g class=\"tn\"><rect x=\"147.0\" y=\"80.0\" width=\"34\" height=\"22\" rx=\"4\"/><text x=\"164.0\" y=\"96.0\" text-anchor=\"middle\">W<\/text><\/g><g class=\"tn\"><rect x=\"103.0\" y=\"142.0\" width=\"34\" height=\"22\" rx=\"4\"/><text x=\"120.0\" y=\"158.0\" text-anchor=\"middle\">R<\/text><\/g><g class=\"tn\"><rect x=\"147.0\" y=\"142.0\" width=\"34\" height=\"22\" rx=\"4\"/><text x=\"164.0\" y=\"158.0\" text-anchor=\"middle\">W<\/text><\/g><g class=\"tn\"><rect x=\"191.0\" y=\"142.0\" width=\"34\" height=\"22\" rx=\"4\"/><text x=\"208.0\" y=\"158.0\" text-anchor=\"middle\">B<\/text><\/g><g class=\"tn\"><rect x=\"279.0\" y=\"80.0\" width=\"34\" height=\"22\" rx=\"4\"/><text x=\"296.0\" y=\"96.0\" text-anchor=\"middle\">B<\/text><\/g><g class=\"tn\"><rect x=\"235.0\" y=\"142.0\" width=\"34\" height=\"22\" rx=\"4\"/><text x=\"252.0\" y=\"158.0\" text-anchor=\"middle\">R<\/text><\/g><g class=\"tn\"><rect x=\"279.0\" y=\"142.0\" width=\"34\" height=\"22\" rx=\"4\"/><text x=\"296.0\" y=\"158.0\" text-anchor=\"middle\">W<\/text><\/g><g class=\"tn\"><rect x=\"323.0\" y=\"142.0\" width=\"34\" height=\"22\" rx=\"4\"/><text x=\"340.0\" y=\"158.0\" text-anchor=\"middle\">B<\/text><\/g><\/svg><\/div><div class=\"bigline sm\">after R: 2 options   ·   after W: 3   ·   after B: 3<\/div><\/div><\/div><div class=\"say\"><p>Try going left to right. Bead 1 has 3 options. But bead 2 has <b>2 options after Red<\/b> (red is used up) and <b>3 options after White<\/b>. The branches are <b>not equal<\/b>, so there's no single number to multiply by. This order is a trap.<\/p><\/div><div class=\"ask\"><b>Ask him:<\/b> After a white first bead, can bead 2 be red?<\/div><\/section><section class=\"frame\" data-i=\"2\" aria-label=\"Step 3 of 6\"><div class=\"fstep\">Step 3 of 6<\/div><div class=\"vis\"><div class=\"beads\"><span class=\"bead r\"><\/span><span class=\"bead q\"><\/span><span class=\"bead q\"><\/span><span class=\"bead q\"><\/span><\/div><div class=\"bigline \"><span class=\"bogus\">1 × 2 × 2 × 2 = 8<\/span><\/div><\/div><div class=\"say\"><p>Another trap: <b>make bead 1 red<\/b> and color the rest. That only counts rows where red is first. It misses every row with red somewhere else.<\/p><\/div><div class=\"ask\"><b>Ask him:<\/b> Find a row that works but isn't in this count.<\/div><\/section><section class=\"frame\" data-i=\"3\" aria-label=\"Step 4 of 6\"><div class=\"fstep\">Step 4 of 6<\/div><div class=\"vis\"><div class=\"beads\"><span class=\"bead r\"><\/span><span class=\"bead q\"><\/span><span class=\"bead q\"><\/span><span class=\"bead q\"><\/span><\/div><div class=\"beads\"><span class=\"bead q\"><\/span><span class=\"bead r\"><\/span><span class=\"bead q\"><\/span><span class=\"bead q\"><\/span><\/div><div class=\"beads\"><span class=\"bead q\"><\/span><span class=\"bead q\"><\/span><span class=\"bead r\"><\/span><span class=\"bead q\"><\/span><\/div><div class=\"beads\"><span class=\"bead q\"><\/span><span class=\"bead q\"><\/span><span class=\"bead q\"><\/span><span class=\"bead r\"><\/span><\/div><\/div><div class=\"say\"><p>So <b>decide the hard rule first<\/b>: <i>which<\/i> bead is red? There are 4 places it could be.<\/p><\/div><\/section><section class=\"frame\" data-i=\"4\" aria-label=\"Step 5 of 6\"><div class=\"fstep\">Step 5 of 6<\/div><div class=\"vis\"><div class=\"slots\"><div class=\"slot on\"><div class=\"sl\">where is red?<\/div><div class=\"sb\"><div class=\"beads\"><span class=\"bead r\"><\/span><span class=\"bead q\"><\/span><span class=\"bead q\"><\/span><span class=\"bead q\"><\/span><\/div><div class=\"beads\"><span class=\"bead q\"><\/span><span class=\"bead r\"><\/span><span class=\"bead q\"><\/span><span class=\"bead q\"><\/span><\/div><div class=\"beads\"><span class=\"bead q\"><\/span><span class=\"bead q\"><\/span><span class=\"bead r\"><\/span><span class=\"bead q\"><\/span><\/div><div class=\"beads\"><span class=\"bead q\"><\/span><span class=\"bead q\"><\/span><span class=\"bead q\"><\/span><span class=\"bead r\"><\/span><\/div><\/div><div class=\"sc\">4<\/div><\/div><div class=\"op\">×<\/div><div class=\"slot on\"><div class=\"sl\">other bead<\/div><div class=\"sb\"><span class=\"chips\"><span class=\"chip \">W<\/span><span class=\"chip \">B<\/span><\/span><\/div><div class=\"sc\">2<\/div><\/div><div class=\"op\">×<\/div><div class=\"slot on\"><div class=\"sl\">other bead<\/div><div class=\"sb\"><span class=\"chips\"><span class=\"chip \">W<\/span><span class=\"chip \">B<\/span><\/span><\/div><div class=\"sc\">2<\/div><\/div><div class=\"op\">×<\/div><div class=\"slot on\"><div class=\"sl\">other bead<\/div><div class=\"sb\"><span class=\"chips\"><span class=\"chip \">W<\/span><span class=\"chip \">B<\/span><\/span><\/div><div class=\"sc\">2<\/div><\/div><div class=\"op\">=<\/div><div class=\"result\">32<\/div><\/div><\/div><div class=\"say\"><p>After that, each of the other 3 beads is White or Black: always 2 options, whatever happened before. Now every branch is equal: 4 × 2 × 2 × 2 = 32.<\/p><\/div><div class=\"ask\"><b>Ask him:<\/b> Why does choosing the red bead first make every branch equal?<\/div><\/section><section class=\"frame\" data-i=\"5\" aria-label=\"Step 6 of 6\"><div class=\"fstep\">Step 6 of 6<\/div><div class=\"vis\"><div class=\"bigline \">Hard rule first → equal branches → multiply<\/div><\/div><div class=\"say\"><p><b>General move:<\/b> when one rule makes the branches uneven, change the order of your decisions so that rule is settled first. You're allowed to build a thing in any order you like; pick the order that makes the counting easy.<\/p><\/div><div class=\"ask\"><b>Ask him:<\/b> In 'a boy at each end', which decision goes first?<\/div><\/section><\/div><div class=\"snav\"><button type=\"button\" class=\"sbtn\" data-prev disabled aria-label=\"Previous step\">← Back<\/button><span class=\"sdots\"><button type=\"button\" class=\"sdot on\" data-go=\"0\" aria-label=\"Go to step 1\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"1\" aria-label=\"Go to step 2\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"2\" aria-label=\"Go to step 3\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"3\" aria-label=\"Go to step 4\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"4\" aria-label=\"Go to step 5\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"5\" aria-label=\"Go to step 6\"><\/button><\/span><button type=\"button\" class=\"sbtn primary\" data-next aria-label=\"Next step\">Next step →<\/button><button type=\"button\" class=\"sbtn ghost\" data-all aria-pressed=\"false\">Show all steps<\/button><\/div><\/div>"], "perm": ["Permutations and factorials", "<div class=\"eq\" role=\"math\">n! = n × (n − 1) × ⋯ × 2 × 1, &nbsp; 0! = 1<\/div><p class=\"idea\"><b>The idea:<\/b> n different things in a row can be arranged in n × (n − 1) × ⋯ × 1 = n! ways.<\/p><div class=\"story concept\" id=\"s-perm\" data-n=\"5\" data-cur=\"0\"><div class=\"shead\">Arranging different things: the shrinking choices<\/div><div class=\"frames\"><section class=\"frame on\" data-i=\"0\" aria-label=\"Step 1 of 5\"><div class=\"fstep\">Step 1 of 5<\/div><div class=\"vis\"><div class=\"chairs\"><div class=\"chair next\"><\/div><div class=\"chair \"><\/div><div class=\"chair \"><\/div><div class=\"chair \"><\/div><div class=\"chair \"><\/div><\/div><span class=\"chips\"><span class=\"chip pick\">A<\/span><span class=\"chip pick\">B<\/span><span class=\"chip pick\">C<\/span><span class=\"chip pick\">D<\/span><span class=\"chip pick\">E<\/span><\/span><\/div><div class=\"say\"><p>Five friends, A to E, sit in five chairs in a row. How many different orders?<\/p><\/div><div class=\"ask\"><b>Ask him:<\/b> Show me two different orders.<\/div><\/section><section class=\"frame\" data-i=\"1\" aria-label=\"Step 2 of 5\"><div class=\"fstep\">Step 2 of 5<\/div><div class=\"vis\"><div class=\"chairs\"><div class=\"chair next\"><\/div><div class=\"chair \"><\/div><div class=\"chair \"><\/div><div class=\"chair \"><\/div><div class=\"chair \"><\/div><\/div><span class=\"chips\"><span class=\"chip pick\">A<\/span><span class=\"chip pick\">B<\/span><span class=\"chip pick\">C<\/span><span class=\"chip pick\">D<\/span><span class=\"chip pick\">E<\/span><\/span><div class=\"slots\"><div class=\"slot on\"><div class=\"sl\">chair 1<\/div><div class=\"sb\"><\/div><div class=\"sc\">5<\/div><\/div><\/div><\/div><div class=\"say\"><p>Chair 1: any of the <b>5<\/b> friends.<\/p><\/div><\/section><section class=\"frame\" data-i=\"2\" aria-label=\"Step 3 of 5\"><div class=\"fstep\">Step 3 of 5<\/div><div class=\"vis\"><div class=\"chairs\"><div class=\"chair full\">A<\/div><div class=\"chair next\"><\/div><div class=\"chair \"><\/div><div class=\"chair \"><\/div><div class=\"chair \"><\/div><\/div><span class=\"chips\"><span class=\"chip used\">A<\/span><span class=\"chip pick\">B<\/span><span class=\"chip pick\">C<\/span><span class=\"chip pick\">D<\/span><span class=\"chip pick\">E<\/span><\/span><div class=\"slots\"><div class=\"slot on\"><div class=\"sl\">chair 1<\/div><div class=\"sb\"><\/div><div class=\"sc\">5<\/div><\/div><div class=\"op\">×<\/div><div class=\"slot on\"><div class=\"sl\">chair 2<\/div><div class=\"sb\"><\/div><div class=\"sc\">4<\/div><\/div><\/div><\/div><div class=\"say\"><p>Chair 2: one friend is already sitting, so <b>4<\/b> are left. <i>Which<\/i> 4 depends on who sat first, but it's always 4.<\/p><\/div><div class=\"ask\"><b>Ask him:<\/b> If C sat first, who's left for chair 2?<\/div><\/section><section class=\"frame\" data-i=\"3\" aria-label=\"Step 4 of 5\"><div class=\"fstep\">Step 4 of 5<\/div><div class=\"vis\"><div class=\"chairs\"><div class=\"chair full\">A<\/div><div class=\"chair full\">B<\/div><div class=\"chair full\">C<\/div><div class=\"chair full\">D<\/div><div class=\"chair next\"><\/div><\/div><span class=\"chips\"><span class=\"chip used\">A<\/span><span class=\"chip used\">B<\/span><span class=\"chip used\">C<\/span><span class=\"chip used\">D<\/span><span class=\"chip pick\">E<\/span><\/span><div class=\"slots\"><div class=\"slot on\"><div class=\"sl\">chair 1<\/div><div class=\"sb\"><\/div><div class=\"sc\">5<\/div><\/div><div class=\"op\">×<\/div><div class=\"slot on\"><div class=\"sl\">chair 2<\/div><div class=\"sb\"><\/div><div class=\"sc\">4<\/div><\/div><div class=\"op\">×<\/div><div class=\"slot on\"><div class=\"sl\">chair 3<\/div><div class=\"sb\"><\/div><div class=\"sc\">3<\/div><\/div><div class=\"op\">×<\/div><div class=\"slot on\"><div class=\"sl\">chair 4<\/div><div class=\"sb\"><\/div><div class=\"sc\">2<\/div><\/div><div class=\"op\">×<\/div><div class=\"slot on\"><div class=\"sl\">chair 5<\/div><div class=\"sb\"><\/div><div class=\"sc\">1<\/div><\/div><div class=\"op\">=<\/div><div class=\"result\">120<\/div><\/div><\/div><div class=\"say\"><p>Keep going: 3, then 2, then 1. Multiply: 5 × 4 × 3 × 2 × 1 = 120.<\/p><\/div><div class=\"ask\"><b>Ask him:<\/b> Why does the number go down by one each time?<\/div><\/section><section class=\"frame\" data-i=\"4\" aria-label=\"Step 5 of 5\"><div class=\"fstep\">Step 5 of 5<\/div><div class=\"vis\"><table class=\"vtable\"><thead><tr><th>n<\/th><th>n! means<\/th><th>value<\/th><\/tr><\/thead><tbody><tr><td>4<\/td><td>4 × 3 × 2 × 1<\/td><td>24<\/td><\/tr><tr><td>5<\/td><td>5 × 4 × 3 × 2 × 1<\/td><td>120<\/td><\/tr><tr><td>6<\/td><td>6 × 5 × 4 × 3 × 2 × 1<\/td><td>720<\/td><\/tr><tr><td>7<\/td><td>7 × 6 × ⋯ × 1<\/td><td>5040<\/td><\/tr><\/tbody><\/table><\/div><div class=\"say\"><p>This product comes up so often it has a name: <b>n factorial<\/b>, written n!. <b>n different things in a row can be arranged in n! ways.<\/b> And 0! = 1: there is exactly one way to arrange nothing (an empty shelf).<\/p><\/div><div class=\"ask\"><b>Ask him:<\/b> How would you use 5! to get 6! quickly?<\/div><\/section><\/div><div class=\"snav\"><button type=\"button\" class=\"sbtn\" data-prev disabled aria-label=\"Previous step\">← Back<\/button><span class=\"sdots\"><button type=\"button\" class=\"sdot on\" data-go=\"0\" aria-label=\"Go to step 1\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"1\" aria-label=\"Go to step 2\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"2\" aria-label=\"Go to step 3\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"3\" aria-label=\"Go to step 4\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"4\" aria-label=\"Go to step 5\"><\/button><\/span><button type=\"button\" class=\"sbtn primary\" data-next aria-label=\"Next step\">Next step →<\/button><button type=\"button\" class=\"sbtn ghost\" data-all aria-pressed=\"false\">Show all steps<\/button><\/div><\/div>"], "shrink": ["Shrinking sets", "<div class=\"eq\" role=\"math\">6 × 5 × 4 × 3 = 360<\/div><p class=\"idea\"><b>The idea:<\/b> With no repeats, each slot loses the options already used.<\/p><div class=\"story concept\" id=\"s-shrink\" data-n=\"5\" data-cur=\"0\"><div class=\"shead\">No repeats: each slot loses what's been used<\/div><div class=\"frames\"><section class=\"frame on\" data-i=\"0\" aria-label=\"Step 1 of 5\"><div class=\"fstep\">Step 1 of 5<\/div><div class=\"vis\"><div class=\"slots\"><div class=\"slot on\"><div class=\"sl\">1st<\/div><div class=\"sb\"><span class=\"chips\"><span class=\"chip \">A<\/span><span class=\"chip \">B<\/span><span class=\"chip \">C<\/span><span class=\"chip \">D<\/span><span class=\"chip \">E<\/span><span class=\"chip \">F<\/span><\/span><\/div><div class=\"sc\">6<\/div><\/div><div class=\"op\">×<\/div><div class=\"slot \"><div class=\"sl\">2nd<\/div><div class=\"sb\"><\/div><div class=\"sc\">?<\/div><\/div><div class=\"op\">×<\/div><div class=\"slot \"><div class=\"sl\">3rd<\/div><div class=\"sb\"><\/div><div class=\"sc\">?<\/div><\/div><div class=\"op\">×<\/div><div class=\"slot \"><div class=\"sl\">4th<\/div><div class=\"sb\"><\/div><div class=\"sc\">?<\/div><\/div><\/div><\/div><div class=\"say\"><p>A secret code is 4 letters from A to F, <b>no letter used twice<\/b>. The first letter: 6 options.<\/p><\/div><\/section><section class=\"frame\" data-i=\"1\" aria-label=\"Step 2 of 5\"><div class=\"fstep\">Step 2 of 5<\/div><div class=\"vis\"><div class=\"slots\"><div class=\"slot on\"><div class=\"sl\">1st<\/div><div class=\"sb\"><span class=\"chips\"><span class=\"chip \">A<\/span><span class=\"chip \">B<\/span><span class=\"chip pick\">C<\/span><span class=\"chip \">D<\/span><span class=\"chip \">E<\/span><span class=\"chip \">F<\/span><\/span><\/div><div class=\"sc\">6<\/div><\/div><div class=\"op\">×<\/div><div class=\"slot on\"><div class=\"sl\">2nd<\/div><div class=\"sb\"><span class=\"chips\"><span class=\"chip \">A<\/span><span class=\"chip \">B<\/span><span class=\"chip used\">C<\/span><span class=\"chip \">D<\/span><span class=\"chip \">E<\/span><span class=\"chip \">F<\/span><\/span><\/div><div class=\"sc\">5<\/div><\/div><div class=\"op\">×<\/div><div class=\"slot \"><div class=\"sl\">3rd<\/div><div class=\"sb\"><\/div><div class=\"sc\">?<\/div><\/div><div class=\"op\">×<\/div><div class=\"slot \"><div class=\"sl\">4th<\/div><div class=\"sb\"><\/div><div class=\"sc\">?<\/div><\/div><\/div><\/div><div class=\"say\"><p>Say the first letter was C. Now C is used, so the second slot has <b>5<\/b> options.<\/p><\/div><\/section><section class=\"frame\" data-i=\"2\" aria-label=\"Step 3 of 5\"><div class=\"fstep\">Step 3 of 5<\/div><div class=\"vis\"><div class=\"slots\"><div class=\"slot on\"><div class=\"sl\">1st<\/div><div class=\"sb\"><\/div><div class=\"sc\">6<\/div><\/div><div class=\"op\">×<\/div><div class=\"slot on\"><div class=\"sl\">2nd<\/div><div class=\"sb\"><\/div><div class=\"sc\">5<\/div><\/div><div class=\"op\">×<\/div><div class=\"slot on\"><div class=\"sl\">3rd<\/div><div class=\"sb\"><\/div><div class=\"sc\">4<\/div><\/div><div class=\"op\">×<\/div><div class=\"slot on\"><div class=\"sl\">4th<\/div><div class=\"sb\"><\/div><div class=\"sc\">3<\/div><\/div><div class=\"op\">=<\/div><div class=\"result\">360<\/div><\/div><\/div><div class=\"say\"><p>Each slot loses one more: 6 × 5 × 4 × 3 = 360. It's like a factorial that stops early, because we only fill 4 slots.<\/p><\/div><div class=\"ask\"><b>Ask him:<\/b> Why don't we keep going down to 1?<\/div><\/section><section class=\"frame\" data-i=\"3\" aria-label=\"Step 4 of 5\"><div class=\"fstep\">Step 4 of 5<\/div><div class=\"vis\"><div class=\"slots\"><div class=\"slot on\"><div class=\"sl\">tens<\/div><div class=\"sb\"><span class=\"chips\"><span class=\"chip banned\">0<\/span><span class=\"chip \">1<\/span><span class=\"chip \">2<\/span><span class=\"chip \">3<\/span><span class=\"chip \">4<\/span><span class=\"chip \">5<\/span><span class=\"chip \">6<\/span><span class=\"chip \">7<\/span><span class=\"chip \">8<\/span><span class=\"chip \">9<\/span><\/span><\/div><div class=\"sc\">9<\/div><\/div><div class=\"op\">×<\/div><div class=\"slot on\"><div class=\"sl\">ones<\/div><div class=\"sb\"><span class=\"chips\"><span class=\"chip \">0<\/span><span class=\"chip \">1<\/span><span class=\"chip \">2<\/span><span class=\"chip \">3<\/span><span class=\"chip used\">4<\/span><span class=\"chip \">5<\/span><span class=\"chip \">6<\/span><span class=\"chip \">7<\/span><span class=\"chip \">8<\/span><span class=\"chip \">9<\/span><\/span><\/div><div class=\"sc\">9<\/div><\/div><div class=\"op\">=<\/div><div class=\"result\">81<\/div><\/div><div class=\"vnote\">if the tens digit was 4: 0 comes back, 4 is used up<\/div><\/div><div class=\"say\"><p>Digits have a twist. Two-digit numbers with <b>different<\/b> digits: the first slot can't be 0 (9 options). The second slot <b>can<\/b> be 0 but can't repeat the first digit: 10 − 1 = 9. So 9 × 9 = 81.<\/p><\/div><div class=\"ask\"><b>Ask him:<\/b> Why do both slots have 9 options, for different reasons?<\/div><\/section><section class=\"frame\" data-i=\"4\" aria-label=\"Step 5 of 5\"><div class=\"fstep\">Step 5 of 5<\/div><div class=\"vis\"><div class=\"bigline \">options left = all options − banned − already used<\/div><\/div><div class=\"say\"><p><b>General move:<\/b> for each slot, start from everything, cross out what the rule bans and what earlier slots used up, then count what's left.<\/p><\/div><\/section><\/div><div class=\"snav\"><button type=\"button\" class=\"sbtn\" data-prev disabled aria-label=\"Previous step\">← Back<\/button><span class=\"sdots\"><button type=\"button\" class=\"sdot on\" data-go=\"0\" aria-label=\"Go to step 1\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"1\" aria-label=\"Go to step 2\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"2\" aria-label=\"Go to step 3\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"3\" aria-label=\"Go to step 4\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"4\" aria-label=\"Go to step 5\"><\/button><\/span><button type=\"button\" class=\"sbtn primary\" data-next aria-label=\"Next step\">Next step →<\/button><button type=\"button\" class=\"sbtn ghost\" data-all aria-pressed=\"false\">Show all steps<\/button><\/div><\/div>"], "overcount": ["Overcounting and repeated letters", "<div class=\"eq\" role=\"math\">arrangements = <span class=\"frac\"><span>n!<\/span><span>m<sub>1<\/sub>! · m<sub>2<\/sub>! ⋯ m<sub>r<\/sub>!<\/span><\/span><\/div><p class=\"idea\"><b>The idea:<\/b> Pretend identical things are different, count, then divide by how many copies each real answer has.<\/p><div class=\"story concept\" id=\"s-overcount\" data-n=\"7\" data-cur=\"0\"><div class=\"shead\">Identical letters: pretend they're different, then undo it<\/div><div class=\"frames\"><section class=\"frame on\" data-i=\"0\" aria-label=\"Step 1 of 7\"><div class=\"fstep\">Step 1 of 7<\/div><div class=\"vis\"><div class=\"vstack\"><span class=\"word\"><span class=\"tile \">T<\/span><span class=\"tile \">O<\/span><span class=\"tile \">O<\/span><\/span><div class=\"bigline \"><span class=\"bogus\">3 letters, so 3! = 6 words?<\/span><\/div><\/div><\/div><div class=\"say\"><p>How many ways can you arrange the letters T, O, O? It's tempting to say 3! = 6, like three different letters. Let's test that.<\/p><\/div><div class=\"ask\"><b>Ask him:<\/b> Can you list 6 different words?<\/div><\/section><section class=\"frame\" data-i=\"1\" aria-label=\"Step 2 of 7\"><div class=\"fstep\">Step 2 of 7<\/div><div class=\"vis\"><div class=\"vrow\" style=\"gap:.5rem\"><span class=\"word\"><span class=\"tile \">T<\/span><span class=\"tile blue\">O<sub>1<\/sub><\/span><span class=\"tile red\">O<sub>2<\/sub><\/span><\/span><span class=\"word\"><span class=\"tile \">T<\/span><span class=\"tile red\">O<sub>2<\/sub><\/span><span class=\"tile blue\">O<sub>1<\/sub><\/span><\/span><span class=\"word\"><span class=\"tile blue\">O<sub>1<\/sub><\/span><span class=\"tile \">T<\/span><span class=\"tile red\">O<sub>2<\/sub><\/span><\/span><span class=\"word\"><span class=\"tile red\">O<sub>2<\/sub><\/span><span class=\"tile \">T<\/span><span class=\"tile blue\">O<sub>1<\/sub><\/span><\/span><span class=\"word\"><span class=\"tile blue\">O<sub>1<\/sub><\/span><span class=\"tile red\">O<sub>2<\/sub><\/span><span class=\"tile \">T<\/span><\/span><span class=\"word\"><span class=\"tile red\">O<sub>2<\/sub><\/span><span class=\"tile blue\">O<sub>1<\/sub><\/span><span class=\"tile \">T<\/span><\/span><\/div><\/div><div class=\"say\"><p>Pretend the O's are different: paint one <b>blue O₁<\/b> and one <b>red O₂<\/b>. Now there really are 6 arrangements.<\/p><\/div><\/section><section class=\"frame\" data-i=\"2\" aria-label=\"Step 3 of 7\"><div class=\"fstep\">Step 3 of 7<\/div><div class=\"vis\"><div class=\"vstack\"><div class=\"bundle-row\"><div class=\"bundle\"><div class=\"bi\"><span class=\"word\"><span class=\"tile \">T<\/span><span class=\"tile blue\">O<sub>1<\/sub><\/span><span class=\"tile red\">O<sub>2<\/sub><\/span><\/span><\/div><div class=\"bi\"><span class=\"word\"><span class=\"tile \">T<\/span><span class=\"tile red\">O<sub>2<\/sub><\/span><span class=\"tile blue\">O<sub>1<\/sub><\/span><\/span><\/div><\/div><div class=\"barrow\">→<\/div><div class=\"bres\"><span class=\"word\"><span class=\"tile \">T<\/span><span class=\"tile \">O<\/span><span class=\"tile \">O<\/span><\/span><\/div><\/div><div class=\"bundle-row\"><div class=\"bundle\"><div class=\"bi\"><span class=\"word\"><span class=\"tile blue\">O<sub>1<\/sub><\/span><span class=\"tile \">T<\/span><span class=\"tile red\">O<sub>2<\/sub><\/span><\/span><\/div><div class=\"bi\"><span class=\"word\"><span class=\"tile red\">O<sub>2<\/sub><\/span><span class=\"tile \">T<\/span><span class=\"tile blue\">O<sub>1<\/sub><\/span><\/span><\/div><\/div><div class=\"barrow\">→<\/div><div class=\"bres\"><span class=\"word\"><span class=\"tile \">O<\/span><span class=\"tile \">T<\/span><span class=\"tile \">O<\/span><\/span><\/div><\/div><div class=\"bundle-row\"><div class=\"bundle\"><div class=\"bi\"><span class=\"word\"><span class=\"tile blue\">O<sub>1<\/sub><\/span><span class=\"tile red\">O<sub>2<\/sub><\/span><span class=\"tile \">T<\/span><\/span><\/div><div class=\"bi\"><span class=\"word\"><span class=\"tile red\">O<sub>2<\/sub><\/span><span class=\"tile blue\">O<sub>1<\/sub><\/span><span class=\"tile \">T<\/span><\/span><\/div><\/div><div class=\"barrow\">→<\/div><div class=\"bres\"><span class=\"word\"><span class=\"tile \">O<\/span><span class=\"tile \">O<\/span><span class=\"tile \">T<\/span><\/span><\/div><\/div><\/div><\/div><div class=\"say\"><p>Now wash the paint off. The arrangements fall into <b>bundles of 2<\/b> that look identical. Every real word appeared exactly twice, so there are 6 ÷ 2 = 3 words.<\/p><\/div><div class=\"ask\"><b>Ask him:<\/b> Why exactly twice? Where does the 2 come from?<\/div><\/section><section class=\"frame\" data-i=\"3\" aria-label=\"Step 4 of 7\"><div class=\"fstep\">Step 4 of 7<\/div><div class=\"vis\"><div class=\"vstack\"><div class=\"bundle-row\"><div class=\"bundle\"><div class=\"bi\"><span class=\"word\"><span class=\"tile blue\">E<sub>1<\/sub><\/span><span class=\"tile \">B<\/span><span class=\"tile red\">E<sub>2<\/sub><\/span><span class=\"tile green\">E<sub>3<\/sub><\/span><\/span><\/div><div class=\"bi\"><span class=\"word\"><span class=\"tile blue\">E<sub>1<\/sub><\/span><span class=\"tile \">B<\/span><span class=\"tile green\">E<sub>3<\/sub><\/span><span class=\"tile red\">E<sub>2<\/sub><\/span><\/span><\/div><div class=\"bi\"><span class=\"word\"><span class=\"tile red\">E<sub>2<\/sub><\/span><span class=\"tile \">B<\/span><span class=\"tile blue\">E<sub>1<\/sub><\/span><span class=\"tile green\">E<sub>3<\/sub><\/span><\/span><\/div><div class=\"bi\"><span class=\"word\"><span class=\"tile red\">E<sub>2<\/sub><\/span><span class=\"tile \">B<\/span><span class=\"tile green\">E<sub>3<\/sub><\/span><span class=\"tile blue\">E<sub>1<\/sub><\/span><\/span><\/div><div class=\"bi\"><span class=\"word\"><span class=\"tile green\">E<sub>3<\/sub><\/span><span class=\"tile \">B<\/span><span class=\"tile blue\">E<sub>1<\/sub><\/span><span class=\"tile red\">E<sub>2<\/sub><\/span><\/span><\/div><div class=\"bi\"><span class=\"word\"><span class=\"tile green\">E<sub>3<\/sub><\/span><span class=\"tile \">B<\/span><span class=\"tile red\">E<sub>2<\/sub><\/span><span class=\"tile blue\">E<sub>1<\/sub><\/span><\/span><\/div><\/div><div class=\"barrow\">→<\/div><div class=\"bres\"><span class=\"word\"><span class=\"tile \">E<\/span><span class=\"tile \">B<\/span><span class=\"tile \">E<\/span><span class=\"tile \">E<\/span><\/span><\/div><\/div><div class=\"blabel\">6 painted copies, one real word<\/div><\/div><\/div><div class=\"say\"><p>Three identical letters: B, E, E, E. Paint the E's three colors. One real word, like EBEE, now shows up once for <b>every order of the three painted E's<\/b>: 3 × 2 × 1 = 3! = 6 times, not 3 times.<\/p><\/div><div class=\"ask\"><b>Ask him:<\/b> List the orders of E₁, E₂, E₃. How many are there?<\/div><\/section><section class=\"frame\" data-i=\"4\" aria-label=\"Step 5 of 7\"><div class=\"fstep\">Step 5 of 7<\/div><div class=\"vis\"><div class=\"slots\"><div class=\"slot on\"><div class=\"sl\">all different<\/div><div class=\"sb\">4 letters<\/div><div class=\"sc\">4!<\/div><\/div><div class=\"op\">÷<\/div><div class=\"slot on\"><div class=\"sl\">painted E's<\/div><div class=\"sb\">orders<\/div><div class=\"sc\">3!<\/div><\/div><div class=\"op\">=<\/div><div class=\"result\">4<\/div><\/div><\/div><div class=\"say\"><p>So the count is 4! ÷ 3! = 24 ÷ 6 = 4: BEEE, EBEE, EEBE, EEEB.<\/p><\/div><\/section><section class=\"frame\" data-i=\"5\" aria-label=\"Step 6 of 7\"><div class=\"fstep\">Step 6 of 7<\/div><div class=\"vis\"><div class=\"vstack\"><div class=\"bundle-row\"><div class=\"bundle\"><div class=\"bi\"><span class=\"word\"><span class=\"tile blue\">A<sub>1<\/sub><\/span><span class=\"tile green\">B<sub>1<\/sub><\/span><span class=\"tile red\">A<sub>2<\/sub><\/span><span class=\"tile blue\">B<sub>2<\/sub><\/span><\/span><\/div><div class=\"bi\"><span class=\"word\"><span class=\"tile red\">A<sub>2<\/sub><\/span><span class=\"tile green\">B<sub>1<\/sub><\/span><span class=\"tile blue\">A<sub>1<\/sub><\/span><span class=\"tile blue\">B<sub>2<\/sub><\/span><\/span><\/div><div class=\"bi\"><span class=\"word\"><span class=\"tile blue\">A<sub>1<\/sub><\/span><span class=\"tile blue\">B<sub>2<\/sub><\/span><span class=\"tile red\">A<sub>2<\/sub><\/span><span class=\"tile green\">B<sub>1<\/sub><\/span><\/span><\/div><div class=\"bi\"><span class=\"word\"><span class=\"tile red\">A<sub>2<\/sub><\/span><span class=\"tile blue\">B<sub>2<\/sub><\/span><span class=\"tile blue\">A<sub>1<\/sub><\/span><span class=\"tile green\">B<sub>1<\/sub><\/span><\/span><\/div><\/div><div class=\"barrow\">→<\/div><div class=\"bres\"><span class=\"word\"><span class=\"tile \">A<\/span><span class=\"tile \">B<\/span><span class=\"tile \">A<\/span><span class=\"tile \">B<\/span><\/span><\/div><\/div><div class=\"bigline sm\">A's: 2 orders × B's: 2 orders = 4 painted copies<\/div><\/div><\/div><div class=\"say\"><p>Two repeated groups, A, A, B, B: each real word has 2 orders for the A's <b>times<\/b> 2 orders for the B's, so 2 × 2 = 4 painted copies. (Multiply, not add: every A-order goes with every B-order.) 4! ÷ 4 = 6 words.<\/p><\/div><div class=\"ask\"><b>Ask him:<\/b> Why 2 × 2 and not 2 + 2?<\/div><\/section><section class=\"frame\" data-i=\"6\" aria-label=\"Step 7 of 7\"><div class=\"fstep\">Step 7 of 7<\/div><div class=\"vis\"><div class=\"bigline \">arrangements = n! ÷ (repeats₁! × repeats₂! × ⋯)<\/div><\/div><div class=\"say\"><p><b>General move:<\/b> count as if every letter were different (n!), then divide by the number of painted copies of each real word: the factorial of each repeat count, multiplied together.<\/p><\/div><div class=\"ask\"><b>Ask him:<\/b> How many words can you make from N, O, O, N?<\/div><\/section><\/div><div class=\"snav\"><button type=\"button\" class=\"sbtn\" data-prev disabled aria-label=\"Previous step\">← Back<\/button><span class=\"sdots\"><button type=\"button\" class=\"sdot on\" data-go=\"0\" aria-label=\"Go to step 1\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"1\" aria-label=\"Go to step 2\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"2\" aria-label=\"Go to step 3\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"3\" aria-label=\"Go to step 4\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"4\" aria-label=\"Go to step 5\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"5\" aria-label=\"Go to step 6\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"6\" aria-label=\"Go to step 7\"><\/button><\/span><button type=\"button\" class=\"sbtn primary\" data-next aria-label=\"Next step\">Next step →<\/button><button type=\"button\" class=\"sbtn ghost\" data-all aria-pressed=\"false\">Show all steps<\/button><\/div><\/div>"], "groups": ["Identical groups", "<div class=\"eq\" role=\"math\"><span class=\"frac\"><span>8!<\/span><span>2!<\/span><\/span><\/div><p class=\"idea\"><b>The idea:<\/b> Count with the groups labeled, then divide by the ways to shuffle the whole groups.<\/p><div class=\"story concept\" id=\"s-groups\" data-n=\"5\" data-cur=\"0\"><div class=\"shead\">Identical groups: divide by the ways to swap whole groups<\/div><div class=\"frames\"><section class=\"frame on\" data-i=\"0\" aria-label=\"Step 1 of 5\"><div class=\"fstep\">Step 1 of 5<\/div><div class=\"vis\"><div class=\"shelves\"><div class=\"shelf\"><span>shelf L<\/span><div class=\"bk\">2<\/div><div class=\"bk\">1<\/div><\/div><div class=\"shelf\"><span>shelf R<\/span><div class=\"bk\">4<\/div><div class=\"bk\">3<\/div><\/div><\/div><\/div><div class=\"say\"><p>Four different books, 1 to 4, go into two stacks of two. Book order inside a stack matters (bottom and top). First, the stacks go on two <b>labeled<\/b> shelves, L and R.<\/p><\/div><\/section><section class=\"frame\" data-i=\"1\" aria-label=\"Step 2 of 5\"><div class=\"fstep\">Step 2 of 5<\/div><div class=\"vis\"><div class=\"slots\"><div class=\"slot on\"><div class=\"sl\">L bottom<\/div><div class=\"sb\"><\/div><div class=\"sc\">4<\/div><\/div><div class=\"op\">×<\/div><div class=\"slot on\"><div class=\"sl\">L top<\/div><div class=\"sb\"><\/div><div class=\"sc\">3<\/div><\/div><div class=\"op\">×<\/div><div class=\"slot on\"><div class=\"sl\">R bottom<\/div><div class=\"sb\"><\/div><div class=\"sc\">2<\/div><\/div><div class=\"op\">×<\/div><div class=\"slot on\"><div class=\"sl\">R top<\/div><div class=\"sb\"><\/div><div class=\"sc\">1<\/div><\/div><div class=\"op\">=<\/div><div class=\"result\">24<\/div><\/div><\/div><div class=\"say\"><p>Fill the four spots one at a time: 4 × 3 × 2 × 1 = 4! = 24.<\/p><\/div><\/section><section class=\"frame\" data-i=\"2\" aria-label=\"Step 3 of 5\"><div class=\"fstep\">Step 3 of 5<\/div><div class=\"vis\"><div class=\"vrow\" style=\"gap:1rem\"><div class=\"shelves\"><div class=\"shelf\"><span>box<\/span><div class=\"bk\">2<\/div><div class=\"bk\">1<\/div><\/div><div class=\"shelf\"><span>box<\/span><div class=\"bk\">4<\/div><div class=\"bk\">3<\/div><\/div><\/div><div class=\"bigline \">same as<\/div><div class=\"shelves\"><div class=\"shelf\"><span>box<\/span><div class=\"bk\">4<\/div><div class=\"bk\">3<\/div><\/div><div class=\"shelf\"><span>box<\/span><div class=\"bk\">2<\/div><div class=\"bk\">1<\/div><\/div><\/div><\/div><\/div><div class=\"say\"><p>Now put the stacks into two <b>identical<\/b> boxes instead. Swapping the two whole stacks no longer changes anything: these two pictures are the same. Every arrangement has exactly one twin, so 24 ÷ 2 = 12.<\/p><\/div><div class=\"ask\"><b>Ask him:<\/b> What exactly got swapped?<\/div><\/section><section class=\"frame\" data-i=\"3\" aria-label=\"Step 4 of 5\"><div class=\"fstep\">Step 4 of 5<\/div><div class=\"vis\"><div class=\"vrow\" style=\"gap:1rem\"><div class=\"shelves\"><div class=\"shelf\"><span>box<\/span><div class=\"bk\">2<\/div><div class=\"bk\">1<\/div><\/div><div class=\"shelf\"><span>box<\/span><div class=\"bk\">4<\/div><div class=\"bk\">3<\/div><\/div><\/div><div class=\"bigline \">≠<\/div><div class=\"shelves\"><div class=\"shelf\"><span>box<\/span><div class=\"bk\">1<\/div><div class=\"bk\">2<\/div><\/div><div class=\"shelf\"><span>box<\/span><div class=\"bk\">4<\/div><div class=\"bk\">3<\/div><\/div><\/div><\/div><\/div><div class=\"say\"><p>But <b>don't<\/b> divide for the order inside a stack: book 1 under book 2 is a different stack from book 2 under book 1.<\/p><\/div><div class=\"ask\"><b>Ask him:<\/b> Which swaps make a new picture, and which don't?<\/div><\/section><section class=\"frame\" data-i=\"4\" aria-label=\"Step 5 of 5\"><div class=\"fstep\">Step 5 of 5<\/div><div class=\"vis\"><div class=\"bigline \">k identical groups → divide by k!<\/div><\/div><div class=\"say\"><p><b>General move:<\/b> count with the groups labeled, then divide by the number of ways to shuffle the whole groups: k! for k identical groups.<\/p><\/div><\/section><\/div><div class=\"snav\"><button type=\"button\" class=\"sbtn\" data-prev disabled aria-label=\"Previous step\">← Back<\/button><span class=\"sdots\"><button type=\"button\" class=\"sdot on\" data-go=\"0\" aria-label=\"Go to step 1\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"1\" aria-label=\"Go to step 2\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"2\" aria-label=\"Go to step 3\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"3\" aria-label=\"Go to step 4\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"4\" aria-label=\"Go to step 5\"><\/button><\/span><button type=\"button\" class=\"sbtn primary\" data-next aria-label=\"Next step\">Next step →<\/button><button type=\"button\" class=\"sbtn ghost\" data-all aria-pressed=\"false\">Show all steps<\/button><\/div><\/div>"], "samecount": ["Same number of choices, different choices", "<div class=\"eq\" role=\"math\">3 × 2<sup>3<\/sup> = 24<\/div><p class=\"idea\"><b>The idea:<\/b> The options may change from branch to branch. Only their number has to stay the same.<\/p><div class=\"story concept\" id=\"s-samecount\" data-n=\"4\" data-cur=\"0\"><div class=\"shead\">Different choices, same number of choices<\/div><div class=\"frames\"><section class=\"frame on\" data-i=\"0\" aria-label=\"Step 1 of 4\"><div class=\"fstep\">Step 1 of 4<\/div><div class=\"vis\"><span class=\"chips\"><span class=\"chip \">R<\/span><span class=\"chip \">G<\/span><span class=\"chip \">B<\/span><\/span><\/div><div class=\"say\"><p>Make a 3-letter sequence of R, G, B where <b>no letter is next to itself<\/b> (RR is banned).<\/p><\/div><div class=\"ask\"><b>Ask him:<\/b> Is RGR allowed? Is RGG?<\/div><\/section><section class=\"frame\" data-i=\"1\" aria-label=\"Step 2 of 4\"><div class=\"fstep\">Step 2 of 4<\/div><div class=\"vis\"><div class=\"treewrap\"><svg class=\"tree\" viewBox=\"0 0 260 184\" width=\"260\" role=\"img\" aria-label=\"tree diagram\"><line x1=\"130.0\" y1=\"30.0\" x2=\"50.0\" y2=\"80.0\" class=\"te\"/><line x1=\"50.0\" y1=\"100.0\" x2=\"30.0\" y2=\"142.0\" class=\"te\"/><line x1=\"50.0\" y1=\"100.0\" x2=\"70.0\" y2=\"142.0\" class=\"te\"/><line x1=\"130.0\" y1=\"30.0\" x2=\"130.0\" y2=\"80.0\" class=\"te\"/><line x1=\"130.0\" y1=\"100.0\" x2=\"110.0\" y2=\"142.0\" class=\"te\"/><line x1=\"130.0\" y1=\"100.0\" x2=\"150.0\" y2=\"142.0\" class=\"te\"/><line x1=\"130.0\" y1=\"30.0\" x2=\"210.0\" y2=\"80.0\" class=\"te\"/><line x1=\"210.0\" y1=\"100.0\" x2=\"190.0\" y2=\"142.0\" class=\"te\"/><line x1=\"210.0\" y1=\"100.0\" x2=\"230.0\" y2=\"142.0\" class=\"te\"/><circle cx=\"130.0\" cy=\"22.0\" r=\"5\" class=\"troot\"/><text x=\"140.0\" y=\"26.0\" class=\"tlab small\">1st → 2nd<\/text><g class=\"tn\"><rect x=\"33.0\" y=\"80.0\" width=\"34\" height=\"22\" rx=\"4\"/><text x=\"50.0\" y=\"96.0\" text-anchor=\"middle\">R<\/text><\/g><g class=\"tn\"><rect x=\"13.0\" y=\"142.0\" width=\"34\" height=\"22\" rx=\"4\"/><text x=\"30.0\" y=\"158.0\" text-anchor=\"middle\">G<\/text><\/g><g class=\"tn\"><rect x=\"53.0\" y=\"142.0\" width=\"34\" height=\"22\" rx=\"4\"/><text x=\"70.0\" y=\"158.0\" text-anchor=\"middle\">B<\/text><\/g><g class=\"tn\"><rect x=\"113.0\" y=\"80.0\" width=\"34\" height=\"22\" rx=\"4\"/><text x=\"130.0\" y=\"96.0\" text-anchor=\"middle\">G<\/text><\/g><g class=\"tn\"><rect x=\"93.0\" y=\"142.0\" width=\"34\" height=\"22\" rx=\"4\"/><text x=\"110.0\" y=\"158.0\" text-anchor=\"middle\">R<\/text><\/g><g class=\"tn\"><rect x=\"133.0\" y=\"142.0\" width=\"34\" height=\"22\" rx=\"4\"/><text x=\"150.0\" y=\"158.0\" text-anchor=\"middle\">B<\/text><\/g><g class=\"tn\"><rect x=\"193.0\" y=\"80.0\" width=\"34\" height=\"22\" rx=\"4\"/><text x=\"210.0\" y=\"96.0\" text-anchor=\"middle\">B<\/text><\/g><g class=\"tn\"><rect x=\"173.0\" y=\"142.0\" width=\"34\" height=\"22\" rx=\"4\"/><text x=\"190.0\" y=\"158.0\" text-anchor=\"middle\">R<\/text><\/g><g class=\"tn\"><rect x=\"213.0\" y=\"142.0\" width=\"34\" height=\"22\" rx=\"4\"/><text x=\"230.0\" y=\"158.0\" text-anchor=\"middle\">G<\/text \">D<\/span><span class=\"chip \">E<\/span><\/span><\/div><div class=\"say\"><p>Pick a <b>team of 3<\/b> from five kids, A to E. A team is just a group: ABC is the same team as CBA.<\/p><\/div><div class=\"ask\"><b>Ask him:<\/b> Is 'A, then B, then C' a different team from 'C, then B, then A'?<\/div><\/section><section class=\"frame\" data-i=\"1\" aria-label=\"Step 2 of 5\"><div class=\"fstep\">Step 2 of 5<\/div><div class=\"vis\"><div class=\"slots\"><div class=\"slot on\"><div class=\"sl\">1st pick<\/div><div class=\"sb\"><\/div><div class=\"sc\">5<\/div><\/div><div class=\"op\">×<\/div><div class=\"slot on\"><div class=\"sl\">2nd pick<\/div><div class=\"sb\"><\/div><div class=\"sc\">4<\/div><\/div><div class=\"op\">×<\/div><div class=\"slot on\"><div class=\"sl\">3rd pick<\/div><div class=\"sb\"><\/div><div class=\"sc\">3<\/div><\/div><div class=\"op\">=<\/div><div class=\"result\">60<\/div><\/div><\/div><div class=\"say\"><p>Pick one kid at a time: 5 × 4 × 3 = 60 <b>ordered<\/b> picks.<\/p><\/div><\/section><section class=\"frame\" data-i=\"2\" aria-label=\"Step 3 of 5\"><div class=\"fstep\">Step 3 of 5<\/div><div class=\"vis\"><div class=\"bundle-row\"><div class=\"bundle\"><div class=\"bi\"><span class=\"word\"><span class=\"tile \">A<\/span><span class=\"tile \">B<\/span><span class=\"tile \">C<\/span><\/span><\/div><div class=\"bi\"><span class=\"word\"><span class=\"tile \">A<\/span><span class=\"tile \">C<\/span><span class=\"tile \">B<\/span><\/span><\/div><div class=\"bi\"><span class=\"word\"><span class=\"tile \">B<\/span><span class=\"tile \">A<\/span><span class=\"tile \">C<\/span><\/span><\/div><div class=\"bi\"><span class=\"word\"><span class=\"tile \">B<\/span><span class=\"tile \">C<\/span><span class=\"tile \">A<\/span><\/span><\/div><div class=\"bi\"><span class=\"word\"><span class=\"tile \">C<\/span><span class=\"tile \">A<\/span><span class=\"tile \">B<\/span><\/span><\/div><div class=\"bi\"><span class=\"word\"><span class=\"tile \">C<\/span><span class=\"tile \">B<\/span><span class=\"tile \">A<\/span><\/span><\/div><\/div><div class=\"barrow\">→<\/div><div class=\"bres\">team {A, B, C}<\/div><\/div><div class=\"blabel\">one team, picked in 6 different orders<\/div><\/div><div class=\"say\"><p>But the team {A, B, C} showed up 6 times in those 60, once for each order of its 3 members: 3! = 6.<\/p><\/div><div class=\"ask\"><b>Ask him:<\/b> List the orders of A, B, C.<\/div><\/section><section class=\"frame\" data-i=\"3\" aria-label=\"Step 4 of 5\"><div class=\"fstep\">Step 4 of 5<\/div><div class=\"vis\"><div class=\"slots\"><div class=\"slot on\"><div class=\"sl\">ordered picks<\/div><div class=\"sb\"><\/div><div class=\"sc\">60<\/div><\/div><div class=\"op\">÷<\/div><div class=\"slot on\"><div class=\"sl\">orders per team<\/div><div class=\"sb\"><\/div><div class=\"sc\">3!<\/div><\/div><div class=\"op\">=<\/div><div class=\"result\">10<\/div><\/div><\/div><div class=\"say\"><p>Every team was counted 6 times, so 60 ÷ 6 = 10 teams.<\/p><\/div><\/section><section class=\"frame\" data-i=\"4\" aria-label=\"Step 5 of 5\"><div class=\"fstep\">Step 5 of 5<\/div><div class=\"vis\"><div class=\"bigline \">choose k with no order = (ordered picks) ÷ k!<\/div><\/div><div class=\"say\"><p><b>General move:<\/b> pretend the picks are in order, multiply, then divide by k! because each group of k was built in k! orders.<\/p><\/div><div class=\"ask\"><b>Ask him:<\/b> How many ways to choose 2 kids out of 5? Use the same move.<\/div><\/section><\/div><div class=\"snav\"><button type=\"button\" class=\"sbtn\" data-prev disabled aria-label=\"Previous step\">← Back<\/button><span class=\"sdots\"><button type=\"button\" class=\"sdot on\" data-go=\"0\" aria-label=\"Go to step 1\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"1\" aria-label=\"Go to step 2\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"2\" aria-label=\"Go to step 3\"><\/button><button type=\"button\" class=\"sdot\" data-go=\"3\" ari /* ---------- Teaching pen ----------

(function () {
  var root = document.documentElement;
  var MODE = root.getAttribute('data-pen-mode') === 'viewport' ? 'viewport' : 'page';
  var DPR = Math.min(2, window.devicePixelRatio || 1);

  var strokes = [], undoStack = [], redoStack = [];

  function toLocal(e) { var o = offset(); return { x: e.clientX + o.x, y: e.clientY + o.y }; }

  function resize() {
    vw = window.innerWidth; vh = window.innerHeight;
    [base, live].forEach(function (c) {

  function setupCtx(ctx) {

  function bbox(s) {

    s.pts.forEach(function (p) { if (p.x < x0) x0 = p.x; if (p.y < y0) y0 = p.y; if (p.x > x1) x1 = p.x; if (p.y > y1) y1 = p.y; });

  /* one smoothed segment k: from mid(k-1,k) to mid(k,k+1), control point k; tapered pen width */

      ctx.lineTo(p[p.length - 1].x, p[p.length - 1].y); ctx.stroke();

  function flush() {

    if (!cur) return;

    lctx.strokeStyle = cur.color;
    var p = cur.pts;

      var shape = { tool: cur.tool, color: cur.color, w: cur.w, straight: cur.straight, pts: [p[0], p[p.length - 1]] };
      if (cur.tool === 'marker') { lctx.save(); drawStroke(lctx, { tool: 'line', color: cur.color, w: cur.w, pts: shape.pts }); lctx.restore(); }
      else drawStroke(lctx, shape);

  /* ---- UI ---- */

    if (b.dataset.tool) { S.tool = b.dataset.tool; mark('[data-tool]', b); }

    if (b.dataset.width) { S.width = b.dataset.width; mark('[data-width]', b); }

  });

    on: function () { setOn(true); }, off: function () { setOn(false); }, isOn: function () { return S.on; },
    undo: undo, redo: redo, clear: clearAll, exportPNG: exportPNG, stats: stats,
    megapixels: function () { return (base.width * base.height + live.width * live.height) / 1e6; },
    resetStats: function () { for (var k in stats) stats[k] = 0; }

})();

/* ---------- pick grid: pointing at a box lights up its twin ---------- */
(function () {
  function pair(el) {
    if (!el || !el.dataset || !el.dataset.tw) return [];
    var tw = document.querySelector('[data-k="' + el.dataset.tw + '"]');
    return tw ? [el, tw] : [el];
  }
  var lit = [];
  function light(el) { lit.forEach(function (x) { x.classList.remove('hl'); }); lit = pair(el); lit.forEach(function (x) { x.classList.add('hl'); }); }
  document.addEventListener('mouseover', function (e) { var c = e.target.closest && e.target.closest('.pc[data-tw]'); if (c) light(c); });
  document.addEventListener('focusin', function (e) { var c = e.target.closest && e.target.closest('.pc[data-tw]'); if (c) light(c); });
  document.addEventListener('click', function (e) { var c = e.target.closest && e.target.closest('.pc[data-tw]'); if (c) light(c); });
})();

/* ---------- step-by-step visual stories ---------- */
(function () {
  function show(st, i) {
    var n = +st.dataset.n; i = Math.max(0, Math.min(n - 1, i)); st.dataset.cur = i;
    st.querySelectorAll('.frame').forEach(function (f, k) { f.classList.toggle('on', k === i); });
    st.querySelectorAll('.sdot').forEach(function (d, k) { d.classList.toggle('on', k === i); d.classList.toggle('seen', k < i); });
    var p = st.querySelector('[data-prev]'), nx = st.querySelector('[data-next]');
    p.disabled = i === 0; nx.disabled = i === n - 1;
    nx.textContent = i === n - 1 ? 'Done' : 'Next step →';
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('.story button'); if (!b) return;
    var st = b.closest('.story'), cur = +st.dataset.cur;
    if (b.hasAttribute('data-next')) show(st, cur + 1);
    else if (b.hasAttribute('data-prev')) show(st, cur - 1);
    else if (b.dataset.go) show(st, +b.dataset.go);
    else if (b.hasAttribute('data-all')) {
      var all = st.classList.toggle('all'); b.setAttribute('aria-pressed', String(all)); b.textContent = all ? 'One step at a time' : 'Show all steps';
    }
  });
  document.addEventListener('keydown', function (e) {
    var st = e.target.closest && e.target.closest('.story'); if (!st) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); show(st, +st.dataset.cur + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); show(st, +st.dataset.cur - 1); }
  });
  window.STORY = { show: show };
})();
