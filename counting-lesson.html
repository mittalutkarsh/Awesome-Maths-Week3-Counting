#pen-bar[hidden]{display:none}
#pen-bar .row{display:flex;gap:.3rem;align-items:center}

  padding:.45rem .9rem;font-size:.85rem;opacity:0;transition:opacity .2s;pointer-events:none}

figure.pfig figcaption{font:.95rem/1.55 var(--serif);color:var(--graphite);margin-top:.5rem;max-width:62ch}

.rules dl{display:grid;grid-template-columns:max-content 1fr;gap:.45rem 1rem;margin:0}

.right{display:flex;flex-direction:column;min-height:0;padding:.8rem 1rem .8rem;gap:.55rem}

#step-q .opts{display:flex;gap:1.2rem;margin-top:.35rem;font-family:var(--sans);font-size:.92rem}
.edwrap{display:flex;border:1px solid var(--ink-soft);background:#fff;flex:1 1 7rem;min-height:6.5rem}

  linear-gradient(transparent calc(1.55em - 1px),var(--rule-2) 1px) 0 .5rem/100% 1.55em local;outline-offset:-3px}
.ansrow{display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}
.ansrow label{font-weight:600;color:var(--ink);font-size:.9rem}
#answer{flex:1;min-width:8rem;font:500 1rem var(--mono);padding:.45rem .55rem;border:1.5px solid var(--ink);background:#fff}
#tries{font:500 .8rem var(--mono);color:var(--muted)}
.btn{border:1.5px solid var(--ink);background:#fff;color:var(--ink);padding:.42rem .8rem;font-weight:500}
.btn.primary{background:var(--ink);color:#fff}

.btn.armed{border-color:var(--red);color:var(--red);background:var(--red-soft)}

.log{padding:.18rem 0;border-bottom:1px solid #243140}
.log .tag{color:#7e93a3;margin-right:.3rem}
.log.ok{color:#9fe0bf}.log.bad{color:#f3b3a9}.log.given{color:#f2cf8a}.log.warn{color:#d9c38f}.log.summary{color:#fff}
.log .nudge{color:#fff}.log .dim{color:#7e93a3}
/* hint dialog */
#hint-dialog{position:fixed;inset:0;background:rgba(22,32,43,.45);display:grid;place-items:center;z-index:100}
#hint-dialog[hidden]{display:none}
.dlg{background:var(--sheet);border:2px solid var(--ink);max-width:30rem;width:calc(100% - 2rem);padding:1rem 1.2rem}
.dlg h2{font:600 1.1rem var(--serif);color:var(--ink);margin:0 0 .5rem}
.dlg p{font:1rem/1.55 var(--serif);margin:0 0 1rem}

  .pane{overflow:visible}.tabpanel{overflow:visible}
  .right{padding-bottom:4.5rem}
  .top nav{margin-left:0;width:100%}
}

digit number 4372. So the first place has 9 options and each other place has 10.<\/p>\n<p>Check it a second way: five-digit numbers run from 10,000 to 99,999, and 99,999 − 10,000 + 1 = 90,000.<\/p>\n<p>A restriction like \"only digits below 4\" changes the list at every place. Two-digit numbers using only 0, 1, 2, 3: the first\nplace is 1, 2 or 3 (3 options), the second is 0, 1, 2 or 3 (4 options), so 3 × 4 = 12. Write the allowed list for each place,\nthen count it.<\/p>"], "first": ["Decide the most restricted thing first", "<div class=\"eq\" role=\"math\">4 × 2<sup>3<\/sup> = 32<\/div>\n<p>You choose the order of your decisions. If one rule is hard to track, settle it before anything else.<\/p>\n<p>Four beads in a row, each red, white or black, with exactly one red bead. Going left to right fails: a later bead has 3 options or 2\ndepending on whether red was already used, so there's no single number to multiply by. Making the first bead red fails too; it misses\nevery row with red somewhere else. Instead decide <em>which<\/em> bead is red first (4 options), then color the rest white or black\n(2 each): 4 × 2 × 2 × 2 = 32.<\/p>\n<p>You can even build a three-digit number right to left: 10 × 10 × 9 gives the same 900.<\/p>"], "perm": ["Permutations and factorials", "<div class=\"eq\" role=\"math\">n! = n × (n − 1) × ⋯ × 2 × 1, &nbsp; 0! = 1<\/div>\n<p>A <strong>permutation<\/strong> is an arrangement, an ordering, of a group of things. For <em>different<\/em> objects the choices shrink\nby one at every position. Five friends in a line: 5 choices for the front, then 4, 3, 2, 1, so 5! = 120 lines.<\/p>\n<p>The friend in second place depends on who went first, but there are always four candidates. Different options, same number of\nthem, so the rule of product works. Try a couple of sample paths to make sure nothing behaves differently.<\/p>\n<p>Zero objects can be arranged in exactly one way: the empty arrangement, like an empty desk. That is why 0! = 1, which also keeps\nn! = n × (n − 1)! true at n = 1.<\/p>"], "shrink": ["Shrinking sets", "<div class=\"eq\" role=\"math\">6 × 5 × 4 × 3 = 360<\/div>\n<p>Four-letter codes from the letters A to F with no letter used twice: 6 options for the first letter, 5 for the second, 4, then 3.\nThat's 360 codes.<\/p>\n<p>Digits work the same way with one twist: the first digit can't be zero, but the second can. Two-digit numbers with different digits:\n9 options first, then 10 − 1 = 9, so 9 × 9 = 81. It looks like a factorial but isn't one: the first place is special, and we stop early.<\/p>"], "overcount": ["Overcounting and repeated letters", "<div class=\"eq\" role=\"math\">arrangements = <span class=\"frac\"><span>n!<\/span><span>m<sub>1<\/sub>! · m<sub>2<\/sub>! ⋯ m<sub>r<\/sub>!<\/span><\/span><\/div>\n<p><strong>Overcounting<\/strong> is counting some or all things more than once. For T, O, O a letter-by-letter tree fails: after T there\nis one kind of letter left, after O there are two, so there's no single multiplier.<\/p>\n<p>Instead pretend the O's are different, a blue O and a red O. Three different letters: 3! = 6 arrangements. Every real word (TOO,\nOTO, OOT) appears exactly twice, blue first or red first, so there are 6 ÷ 2 = 3. Divide only when <em>everything<\/em> is counted the\nsame number of times.<\/p>\n<p>With three identical letters the overcount factor is the number of ways to order three colored copies, 3! = 6, not 3. For B, E, E, E:\n4! ÷ 3! = 24 ÷ 6 = 4 (BEEE, EBEE, EEBE, EEEB). With two repeated groups the orderings combine by the rule of product: A, A, B, B gives\n4! ÷ (2! × 2!) = 6.<\/p>\n<p>Cancel before multiplying: 6!/4! = 6 × 5 = 30.<\/p>"], "groups": ["Identical groups", "<div class=\"eq\" role=\"math\"><span class=\"frac\"><span>8!<\/span><span>2!<\/span><\/span><\/div>\n<p>Eight different books go into two stacks of four, one stack on each of two labeled shelves. Order inside a stack matters, so filling\nthe shelves one slot at a time is just arranging all eight books: 8!.<\/p>\n<p>Now put the stacks into two identical boxes instead. Any finished pair of stacks can be put on labeled shelves in 2! ways, and those\nnow look the same. Divide by 2!. Don't divide by 4! for each stack: swapping books inside a stack still changes the stack.<\/p>"], "samecount": ["Same number of choices, different choices", "<div class=\"eq\" role=\"math\">3 × 2<sup>3<\/sup> = 24<\/div>\n<p>A four-letter sequence of R, G, B where no letter appears twice in a row. After R the next letter is G or B; after G it's R or B.\nThe next letters depend on the last one, but there are always two of them. So 3 × 2 × 2 × 2 = 24. That's all the rule of product\nneeds.<\/p>"], "order": ["Removing order to count sets", "<div class=\"eq\" role=\"math\"><span class=\"frac\"><span>5 × 4 × 3<\/span><span>3!<\/span><\/span> = 10<\/div>\n<p>A <em>set<\/em> has no first, second or third member. Picking a team of three from five kids one at a time gives 5 × 4 × 3 = 60\nordered picks, but each team was picked once for every order of its three members: 3! = 6 times. So there are 60 ÷ 6 = 10 teams.<\/p>\n<p>Build with order, then divide by the number of orders.<\/p>"], "pairs": ["Pick grids: when does order matter?", "<div class=\"eq\" role=\"math\">pairs = <span class=\"frac\"><span>n × (n − 1)<\/span><span>2<\/span><\/span><\/div>\n<p>To count pairs from a group, build a grid. Put the first pick down the side and the second pick across the top. Four people,\nA, B, C, D, make a 4 × 4 grid: 16 boxes, and every box is one way to say \"first I pick this person, then that one.\"<\/p>\n<p>Ask three questions, in order.<\/p>\n<ol><li><b>How many boxes?<\/b> 4 × 4 = 16.<\/li>\n<li><b>Which boxes aren't allowed?<\/b> The diagonal picks the same person twice (A then A). Cross out those 4: 12 left.<\/li>\n<li><b>Are any two boxes the same thing?<\/b> Point at AB, then at BA. If the order doesn't matter, they're the same pair, and every\nteal box has a grey twin across the diagonal. So 12 boxes are really 6 pairs: 12 ÷ 2 = 6.<\/li><\/ol>\n<figure class=\"pfig\" id=\"g4-\"><div class=\"pscroll\"><div class=\"pgrid\" style=\"--cols:4\" role=\"table\" aria-label=\"1st pick by 2nd pick\"><div class=\"ph corner\" role=\"columnheader\"><span>1st pick ↓<\/span><span>2nd pick →<\/span><\/div><div class=\"ph\" role=\"columnheader\">A<\/div><div class=\"ph\" role=\"columnheader\">B<\/div><div class=\"ph\" role=\"columnheader\">C<\/div><div class=\"ph\" role=\"columnheader\">D<\/div><div class=\"ph rh\" role=\"rowheader\">A<\/div><div class=\"pc x\" role=\"cell\" data-k=\"g4-0-0\" aria-label=\"AA not allowed\">×<\/div><div class=\"pc keep\" role=\"cell\" data-k=\"g4-0-1\" data-tw=\"g4-1-0\" aria-label=\"AB counted\" tabindex=0><b>AB<\/b><\/div><div class=\"pc keep\" role=\"cell\" data-k=\"g4-0-2\" data-tw=\"g4-2-0\" aria-label=\"AC counted\" tabindex=0><b>AC<\/b><\/div><div class=\"pc keep\" role=\"cell\" data-k=\"g4-0-3\" data-tw=\"g4-3-0\" aria-label=\"AD counted\" tabindex=0><b>AD<\/b><\/div><div class=\"ph rh\" role=\"rowheader\">B<\/div><div class=\"pc twin\" role=\"cell\" data-k=\"g4-1-0\" data-tw=\"g4-0-1\" aria-label=\"BA same group as its twin\" tabindex=0><b>BA<\/b><\/div><div class=\"pc x\" role=\"cell\" data-k=\"g4-1-1\" aria-label=\"BB not allowed\">×<\/div><div class=\"pc keep\" role=\"cell\" data-k=\"g4-1-2\" data-tw=\"g4-2-1\" aria-label=\"BC counted\" tabindex=0><b>BC<\/b><\/div><div class=\"pc keep\" role=\"cell\" data-k=\"g4-1-3\" data-tw=\"g4-3-1\" aria-label=\"BD counted\" tabindex=0><b>BD<\/b><\/div><div class=\"ph rh\" role=\"rowheader\">C<\/div><div class=\"pc twin\" role=\"cell\" data-k=\"g4-2-0\" data-tw=\"g4-0-2\" aria-label=\"CA same group as its twin\" tabindex=0><b>CA<\/b><\/div><div class=\"pc twin\" role=\"cell\" data-k=\"g4-2-1\" data-tw=\"g4-1-2\" aria-label=\"CB same group as its twin\" tabindex=0><b>CB<\/b><\/div><div class=\"pc x\" role=\"cell\" data-k=\"g4-2-2\" aria-label=\"CC not allowed\">×<\/div><div class=\"pc keep\" role=\"cell\" data-k=\"g4-2-3\" data-tw=\"g4-3-2\" aria-label=\"CD counted\" tabindex=0><b>CD<\/b><\/div><div class=\"ph rh\" role=\"rowheader\">D<\/div><div class=\"pc twin\" role=\"cell\" data-k=\"g4-3-0\" data-tw=\"g4-0-3\" aria-label=\"DA same group as its twin\" tabindex=0><b>DA<\/b><\/div><div class=\"pc twin\" role=\"cell\" data-k=\"g4-3-1\" data-tw=\"g4-1-3\" aria-label=\"DB same group as its twin\" tabindex=0><b>DB<\/b><\/div><div class=\"pc twin\" role=\"cell\" data-k=\"g4-3-2\" data-tw=\"g4-2-3\" aria-label=\"DC same group as its twin\" tabindex=0><b>DC<\/b><\/div><div class=\"pc x\" role=\"cell\" data-k=\"g4-3-3\" aria-label=\"DD not allowed\">×<\/div><\/div><\/div><div class=\"plegend\"><span><i class=\"k keep\"><\/i>counted<\/span><span><i class=\"k twin\"><\/i>twin of a counted box (same group, written backwards)<\/span><span><i class=\"k x\"><\/i>same one picked twice<\/span><span><i class=\"k plain\"><\/i>counted, and has no twin<\/span><\/div><figcaption>16 boxes, 4 crossed out, 12 left. They come in 6 twin pairs, so there are 6 pairs of people.<\/figcaption><\/figure>\n<p>Question 3 is the whole idea. If the answer is no (a home game and an away game, a red card and a black card, a captain and a\nvice-captain) there are no twins and nothing to divide. If the answer is yes (handshakes, teams, hands of cards) divide by 2.<\/p>\n<p>Point at any grey box to light up its twin.<\/p>"]}};

(function () {

  var el = {

    rail: $id('rail'), railToggle: $id('rail-toggle'), tabs: $id('tabs'), body: $id('problem-body'),
    verified: $id('verified'), worked: $id('worked'), stepsList: $id('steps-list'),
    pills: $id('step-pills'), q: $id('step-q'), tries: $id('tries'), editor: $id('editor'), gutter: $id('gutter'),
    answer: $id('answer'), check: $id('check-btn'), hint: $id('hint-btn'), submit: $id('submit-btn'), workedBtn: $id('worked-btn'),
    console: $id('console'), dlg: $id('hint-dialog'), dlgTitle: $id('hint-title'), dlgText: $id('hint-text'), dlgClose: $id('hint-close'),

  };

  function closed(s) { return s.status !== 'open'; }

  }

  /* ---- navigation chrome ---- */

  }

      var st = probState(id), a = document.getElementById('rail-' + id);

  }
  function statusText(x) {

    }).join('');
    var st = p.steps[s.step], x = s.steps[s.step];

      (st.options ? '<span class="opts">' + st.options.map(function (o, n) { return '<span>' + String.fromCharCode(65 + n) + ') ' + esc(o) + '</span>'; }).join('') + '</span>' : '');
    el.answer.placeholder = st.ph;
    el.answer.value = x.answer;
    el.editor.value = x.work;
    gutter();

    el.stepsList.innerHTML = p.steps.map(function (st2, i) {

    el.workedBtn.classList.toggle('armed', s.armed);

  function gutter() {

  function renderAll() { renderProblem(); renderSteps(); refreshNav(); }

  function go(id, opts) {

    if (!(opts && opts.noHash)) writeHash(id);
    document.body.classList.remove('rail-open');
  }
  function saveInputs() { var x = ST[cur].steps[ST[cur].step]; x.work = el.editor.value; if (!closed(x)) x.answer = el.answer.value; }

  /* ---- the grading loop ---- */
  function nextOpen(s, from) {
    for (var i = from + 1; i < s.steps.length; i++) if (!closed(s.steps[i])) return i;
    for (var j = 0; j < s.steps.length; j++) if (!closed(s.steps[j])) return j;
    return -1;
  }
  function checkStep() {
    var p = BY[cur], s = ST[cur], i = s.step, st = p.steps[i], x = s.steps[i];
    saveInputs();
    if (closed(x)) { log('info', 'This step is already closed.'); return; }
    var prev = p.steps.slice(0, i).map(function (q) { return typeof q.ans === 'number' ? q.ans : null; });
    var r = Check.grade(st, el.answer.value, { prev: prev });

    x.tries++;

      x.status = x.tries === 1 ? 'first' : 'tries';
      log('ok', 'Try ' + x.tries + ': <b>' + shown + '</b>, correct. ' + esc(st.success));

    } else if (!x.final && x.tries < 3) {
      log('bad', 'Try ' + x.tries + ': <b>' + shown + '</b>. ' + esc(r.msg) + ' <span class="nudge">' + esc(st.nudges[x.tries - 1]) + '</span>');
    } else if (!x.final) {
      x.final = true;
      log('bad', 'Try ' + x.tries + ': <b>' + shown + '</b>. ' + esc(r.msg) + ' <span class="nudge">' + esc(st.nudges[2]) + '</span> One final attempt on this step.');
    } else {
      x.status = 'given'; x.answer = '';

      var n = nextOpen(s, i);

  }

})();

/* ---------- pick grid: pointing at a box lights up its twin ---------- */
(function () {
  function pair(el) {
    if (!el || !el.dataset || !el.dataset.tw) return [];
    var tw = document.querySelector('[data-k="' + el.dataset.tw + '"]');
    return tw ? [el, tw] : [el];
  }
  var lit = [];
  function light(el) { lit.forEach(function (x) { x.classList.remove('hl'); }); lit = pair(el); lit.forEach(function (x) { x.classList.add('hl'); }); }
  document.addEventListener('mouseover', function (e) { var c = e.target.closest && e.target.closest('.pc[data-tw]'); if (c) light(c); });
  document.addEventListener('focusin', function (e) { var c = e.target.closest && e.target.closest('.pc[data-tw]'); if (c) light(c); });
  document.addEventListener('click', function (e) { var c = e.target.closest && e.target.closest('.pc[data-tw]'); if (c) light(c); });
})();
